<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7; color: #1d1d1f;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem 1rem;
    }

    h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 700; margin-bottom: 0.4rem; }
    p  { font-size: 1rem; color: #6e6e73; margin-bottom: 2.5rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 680px;
    }

    .tile {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      text-decoration: none;
      color: #1d1d1f;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      transition: box-shadow 0.15s, transform 0.15s;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .tile:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      transform: translateY(-2px);
    }

    .tile-icon { font-size: 2rem; }
    .tile-name { font-size: 1rem; font-weight: 700; }
    .tile-desc { font-size: 0.82rem; color: #6e6e73; }
  </style>
</head>
<body>
  <h1>Personal Shortcut</h1>
  <p>Your personal dashboards, all in one place.</p>

  <div class="grid">
    <a class="tile" href="/expenses/">
      <span class="tile-icon">💰</span>
      <span class="tile-name">Expenses</span>
      <span class="tile-desc">Track and summarise your spending from Notion</span>
    </a>
    <a class="tile" href="/habits/">
      <span class="tile-icon">✅</span>
      <span class="tile-name">Habits</span>
      <span class="tile-desc">Daily habit completion and score tracking</span>
    </a>
  </div>
</body>
</html>
