<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Books</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:    #059669;
      --accent-2:  #0891B2;
      --grad:      linear-gradient(135deg, #059669, #0891B2);
      --grad-soft: linear-gradient(135deg, #ECFDF5, #E0F7FA);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F5F4FA; color: #111827;
      min-height: 100vh; padding: 1.25rem 0.75rem; position: relative;
    }
    .orb { position: fixed; border-radius: 50%; filter: blur(90px); z-index: 0; pointer-events: none; }
    .orb-1 { width: 450px; height: 450px; background: rgba(5,150,105,0.10); top: -120px; right: -80px; animation: _float 9s ease-in-out infinite; }
    .orb-2 { width: 350px; height: 350px; background: rgba(8,145,178,0.08); bottom: -100px; left: -80px; animation: _float 11s ease-in-out infinite 2s; }

    .container { max-width: 1400px; margin: 0 auto; position: relative; z-index: 1; }

    nav {
      display: inline-flex; gap: 0.2rem; flex-wrap: wrap;
      background: rgba(255,255,255,0.75); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.9); border-radius: 100px;
      padding: 0.3rem; box-shadow: 0 4px 20px rgba(0,0,0,0.07);
      margin-bottom: 2rem; animation: _fadeIn 0.5s ease both;
    }
    nav a {
      padding: 0.45rem 1.1rem; border-radius: 100px; font-size: 0.85rem;
      font-weight: 600; text-decoration: none; transition: all 0.2s ease; color: #6B7280;
    }
    nav a.active { background: var(--grad); color: #fff; box-shadow: 0 4px 14px rgba(5,150,105,0.35); }
    nav a:not(.active):hover { background: rgba(5,150,105,0.07); color: var(--accent); }

    /* Drive link */
    .drive-link {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.15rem 0.55rem; border-radius: 100px; font-size: 0.68rem; font-weight: 600;
      background: rgba(8,145,178,0.10); color: #0891B2;
      border: 1px solid rgba(8,145,178,0.20); text-decoration: none;
      transition: all 0.18s; white-space: nowrap;
    }
    .drive-link:hover { background: linear-gradient(135deg,#059669,#0891B2); color:#fff; border-color:transparent; }
    .drive-link-notion { background: rgba(99,102,241,0.10); color: #4F46E5; border-color: rgba(99,102,241,0.22); }
    .drive-link-notion:hover { background: linear-gradient(135deg,#4F46E5,#7C3AED); color:#fff; border-color:transparent; }
    .drive-link-none { background: rgba(156,163,175,0.10); color: #9CA3AF; border: 1px dashed #D1D5DB; font-style: italic; pointer-events: none; }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 500; letter-spacing: -0.02em;
      margin-bottom: 1.5rem; background: var(--grad);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: _fadeUp 0.55s 0.1s ease both;
    }

    .section-heading {
      font-size: 0.95rem; font-weight: 600; color: #4B5563; margin: 1.75rem 0 0.75rem;
      letter-spacing: -0.01em; display: flex; align-items: center; gap: 0.5rem;
      animation: _slideLeft 0.45s ease both; animation-play-state: paused;
    }

    .card {
      background: rgba(255,255,255,0.75); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.9); border-radius: 20px;
      padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      animation: _fadeUp 0.5s ease both; animation-play-state: paused;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.12); }

    /* Stats row */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.85rem; }
    .stat-card {
      background: rgba(255,255,255,0.75); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.9); border-radius: 16px;
      padding: 1rem 1.25rem; box-shadow: 0 4px 18px rgba(0,0,0,0.05);
      animation: _fadeUp 0.5s ease both; animation-play-state: paused;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
    }
    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 12px 36px rgba(0,0,0,0.10); }
    .stat-label { font-size: 0.7rem; font-weight: 500; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.35rem; }
    .stat-value { font-size: 1.75rem; font-weight: 400; letter-spacing: -0.03em; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    /* Charts row */
    .charts-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-bottom: 1rem; }
    .chart-wrap { position: relative; height: 260px; }

    /* Filters */
    .filters { display: grid; grid-template-columns: 1fr; gap: 0.85rem; }
    label { display: block; font-size: 0.68rem; font-weight: 500; color: #9CA3AF; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.06em; }
    select, input[type="text"] {
      width: 100%; padding: 0.65rem 0.9rem; border: 1.5px solid #E5E7EB; border-radius: 12px;
      font-size: 0.93rem; font-family: inherit; background: rgba(255,255,255,0.9); color: #111827;
      appearance: none; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(5,150,105,0.12); }

    .btn-primary {
      margin-top: 1.1rem; padding: 0.55rem 1.75rem;
      display: block; width: fit-content;
      background: var(--grad); color: #fff; border: none; border-radius: 100px;
      font-size: 0.88rem; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(5,150,105,0.30); letter-spacing: 0.01em;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(5,150,105,0.45); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-ghost {
      padding: 0.4rem 1rem; font-size: 0.82rem; font-weight: 600;
      background: rgba(5,150,105,0.07); color: var(--accent);
      border: 1px solid rgba(5,150,105,0.18); border-radius: 100px;
      cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .btn-ghost:hover { background: var(--grad); color: #fff; border-color: transparent; }
    .btn-ghost:active { transform: scale(0.97); }

    /* Book list */
    .book-list { display: flex; flex-direction: column; gap: 0.65rem; }
    .book-row {
      display: flex; align-items: flex-start; gap: 1rem;
      background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.85);
      border-radius: 14px; padding: 1rem 1.1rem; transition: all 0.2s ease;
      animation: _fadeUp 0.3s ease both;
    }
    .book-row:hover { background: rgba(255,255,255,0.9); box-shadow: 0 4px 18px rgba(0,0,0,0.07); transform: translateX(3px); }
    .book-icon {
      width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
      background: var(--grad-soft); display: flex; align-items: center;
      justify-content: center; font-size: 1.1rem;
    }
    .book-info { flex: 1; min-width: 0; }
    .book-name { font-size: 0.92rem; font-weight: 600; color: #1F2937; margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .book-meta { font-size: 0.78rem; color: #9CA3AF; font-weight: 400; }
    .book-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; flex-shrink: 0; }

    /* Status badges */
    .badge { display: inline-block; padding: 0.18rem 0.6rem; border-radius: 100px; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.01em; white-space: nowrap; }
    .badge-reading  { background: rgba(5,150,105,0.12); color: #059669; }
    .badge-finished { background: rgba(99,102,241,0.12); color: #4F46E5; }
    .badge-to-read  { background: rgba(245,158,11,0.12); color: #D97706; }
    .badge-queued   { background: rgba(8,145,178,0.12); color: #0891B2; }
    .badge-blocked  { background: rgba(239,68,68,0.12); color: #DC2626; }
    .badge-default  { background: rgba(156,163,175,0.15); color: #6B7280; }

    .genre-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .genre-tag { padding: 0.1rem 0.5rem; border-radius: 100px; font-size: 0.65rem; font-weight: 500; background: rgba(5,150,105,0.07); color: #059669; }

    /* Pagination */
    .pagination { display: flex; justify-content: center; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
    .page-btn {
      padding: 0.4rem 0.9rem; border-radius: 100px; font-size: 0.82rem; font-weight: 600;
      background: rgba(5,150,105,0.07); color: var(--accent);
      border: 1px solid rgba(5,150,105,0.18);
      cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .page-btn:hover, .page-btn.active { background: var(--grad); color: #fff; border-color: transparent; }
    .page-btn:active { transform: scale(0.97); }

    /* Cache bar */
    .cache-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(5,150,105,0.06); border: 1px solid rgba(5,150,105,0.12);
      border-radius: 12px; padding: 0.6rem 1rem; margin-bottom: 1rem; gap: 0.75rem; flex-wrap: wrap;
    }
    .cache-bar span { font-size: 0.78rem; color: #6B7280; font-weight: 500; }
    .cache-bar-actions { display: flex; gap: 0.5rem; }
    .cache-bar button {
      padding: 0.3rem 0.85rem; font-size: 0.75rem; font-weight: 600;
      background: rgba(5,150,105,0.1); color: var(--accent);
      border: 1px solid rgba(5,150,105,0.2); border-radius: 100px;
      cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .cache-bar button:hover { background: var(--grad); color: #fff; border-color: transparent; }
    .cache-bar button:active { transform: scale(0.97); }
    .btn-add {
      background: var(--grad) !important; color: #fff !important;
      border-color: transparent !important; font-weight: 700 !important;
      box-shadow: 0 4px 12px rgba(5,150,105,0.30);
    }
    .btn-add:hover { box-shadow: 0 6px 18px rgba(5,150,105,0.45) !important; }

    .empty { text-align: center; padding: 2.5rem 1rem; color: #9CA3AF; font-size: 0.9rem; font-weight: 500; }

    /* ── Add Book Modal ── */
    .ab-overlay {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 1rem;
    }
    .ab-overlay.open { display: flex; }
    .ab-modal {
      background: #fff; border-radius: 24px; padding: 1.75rem;
      width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 24px 80px rgba(0,0,0,0.20);
      animation: _modalPop 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes _modalPop { from { opacity:0; transform:scale(0.88) translateY(20px); } to { opacity:1; transform:none; } }
    .ab-modal h2 { font-size: 1.05rem; font-weight: 500; margin-bottom: 1.25rem; letter-spacing: -0.01em; }
    .ab-field { margin-bottom: 0.9rem; }
    .ab-field label { font-size: 0.68rem; font-weight: 500; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 0.3rem; }
    .ab-field input, .ab-field select, .ab-field textarea {
      width: 100%; padding: 0.65rem 0.9rem; border: 1.5px solid #E5E7EB; border-radius: 12px;
      font-size: 0.93rem; font-family: inherit; background: #fff; color: #111827;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s; resize: vertical;
    }
    .ab-field input:focus, .ab-field select:focus, .ab-field textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px rgba(5,150,105,0.12);
    }

    /* Genre pills in modal */
    .pill-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; max-height: 160px; overflow-y: auto; padding: 0.5rem; border: 1.5px solid #E5E7EB; border-radius: 12px; }
    .pill {
      padding: 0.25rem 0.75rem; border-radius: 100px; font-size: 0.75rem; font-weight: 600;
      background: rgba(5,150,105,0.07); color: var(--accent);
      border: 1.5px solid rgba(5,150,105,0.15);
      cursor: pointer; transition: all 0.15s; user-select: none;
    }
    .pill.selected { background: var(--grad); color: #fff; border-color: transparent; }

    /* Drive file picker */
    .drive-picker { position: relative; }
    .drive-search-wrap { position: relative; }
    .drive-search-wrap input { padding-right: 2.2rem; }
    .drive-clear {
      position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #9CA3AF; font-size: 1rem;
      display: none; padding: 0; line-height: 1;
    }
    .drive-clear.visible { display: block; }
    .drive-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 600;
      background: #fff; border: 1.5px solid #E5E7EB; border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12); max-height: 220px; overflow-y: auto;
      display: none;
    }
    .drive-dropdown.open { display: block; }
    .drive-opt {
      display: flex; align-items: center; gap: 0.55rem;
      padding: 0.6rem 0.9rem; cursor: pointer; font-size: 0.87rem;
      font-weight: 500; transition: background 0.15s; border-radius: 0;
    }
    .drive-opt:first-child { border-radius: 12px 12px 0 0; }
    .drive-opt:last-child  { border-radius: 0 0 12px 12px; }
    .drive-opt:only-child  { border-radius: 12px; }
    .drive-opt:hover { background: rgba(5,150,105,0.07); }
    .drive-opt.selected { background: rgba(5,150,105,0.12); font-weight: 700; }
    .drive-opt-icon { font-size: 1rem; flex-shrink: 0; }
    .drive-opt-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .drive-selected-badge {
      display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.4rem;
      padding: 0.25rem 0.7rem; border-radius: 100px; font-size: 0.75rem; font-weight: 600;
      background: rgba(5,150,105,0.10); color: var(--accent);
      border: 1px solid rgba(5,150,105,0.20);
    }
    .drive-empty { padding: 0.9rem; text-align: center; color: #9CA3AF; font-size: 0.83rem; }

    /* Upload button */
    .drive-upload-row { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.55rem; }
    .drive-upload-btn {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.4rem 0.9rem; border-radius: 100px; font-size: 0.78rem; font-weight: 600;
      background: rgba(8,145,178,0.08); color: #0891B2;
      border: 1.5px solid rgba(8,145,178,0.20);
      cursor: pointer; font-family: inherit; transition: all 0.2s; white-space: nowrap;
    }
    .drive-upload-btn:hover { background: linear-gradient(135deg,#059669,#0891B2); color:#fff; border-color:transparent; }
    .drive-upload-btn:active { transform: scale(0.97); }
    .drive-upload-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .drive-upload-progress {
      flex: 1; height: 6px; border-radius: 100px; background: #E5E7EB;
      overflow: hidden; display: none;
    }
    .drive-upload-progress-bar {
      height: 100%; border-radius: 100px;
      background: linear-gradient(90deg, #059669, #0891B2);
      width: 0%; transition: width 0.3s ease;
    }
    .drive-upload-status { font-size: 0.75rem; color: #6B7280; font-weight: 500; }

    [data-theme="dark"] .drive-dropdown { background: #1E1E2C; border-color: rgba(255,255,255,0.10); }
    [data-theme="dark"] .drive-opt:hover { background: rgba(5,150,105,0.12); }
    [data-theme="dark"] .drive-opt-name { color: #F9FAFB; }
    [data-theme="dark"] .drive-upload-progress { background: rgba(255,255,255,0.10); }

    .ab-actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; }
    .ab-actions button { flex: 1; padding: 0.8rem; border-radius: 100px; font-size: 0.93rem; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.2s; border: none; }
    .ab-save { background: var(--grad); color: #fff; box-shadow: 0 4px 15px rgba(5,150,105,0.35); }
    .ab-save:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(5,150,105,0.45); }
    .ab-save:active { transform: scale(0.97); }
    .ab-cancel { background: rgba(156,163,175,0.15); color: #6B7280; }
    .ab-cancel:hover { background: rgba(156,163,175,0.25); }
    .ab-cancel:active { transform: scale(0.97); }

    /* ── Theme toggle ── */
    .theme-btn {
      position: fixed; top: 0.75rem; right: 0.75rem; z-index: 300;
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.82); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.88); box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s; font-family: inherit;
    }
    .theme-btn:hover { transform: scale(1.12); box-shadow: 0 4px 18px rgba(0,0,0,0.16); }
    .theme-btn:active { transform: scale(0.9); }

    /* ── Responsive ── */
    @media (min-width: 640px) {
      .stats-grid { grid-template-columns: repeat(4, 1fr); }
      .filters { grid-template-columns: repeat(2, 1fr); }
      .charts-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 1024px) {
      .layout { display: grid; grid-template-columns: 280px 1fr; gap: 1.5rem; align-items: start; }
      .filters { grid-template-columns: 1fr; }
    }

    /* ── Keyframes ── */
    @keyframes _fadeUp   { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
    @keyframes _fadeIn   { from { opacity:0; } to { opacity:1; } }
    @keyframes _slideLeft{ from { opacity:0; transform:translateX(-14px); } to { opacity:1; transform:none; } }
    @keyframes _float    { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }
    @media (prefers-reduced-motion:reduce){ *, *::before, *::after { animation-duration:0.01ms!important; transition-duration:0.01ms!important; } }

    /* ── Dark mode ── */
    [data-theme="dark"] body { background: #0F0F14; color: #F9FAFB; }
    [data-theme="dark"] .card, [data-theme="dark"] .stat-card {
      background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.07);
      box-shadow: 0 4px 24px rgba(0,0,0,0.30);
    }
    [data-theme="dark"] .card:hover, [data-theme="dark"] .stat-card:hover { box-shadow: 0 20px 60px rgba(0,0,0,0.50); }
    [data-theme="dark"] nav { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.08); }
    [data-theme="dark"] select, [data-theme="dark"] input[type="text"] { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.10); color: #F9FAFB; }
    [data-theme="dark"] .book-row { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.07); }
    [data-theme="dark"] .book-row:hover { background: rgba(255,255,255,0.07); }
    [data-theme="dark"] .book-name { color: #F9FAFB; }
    [data-theme="dark"] .section-heading { color: #E5E7EB; }
    [data-theme="dark"] .stat-label { color: #6B7280; }
    [data-theme="dark"] .cache-bar { background: rgba(5,150,105,0.08); border-color: rgba(5,150,105,0.15); }
    [data-theme="dark"] .theme-btn { background: rgba(28,28,40,0.92); border-color: rgba(255,255,255,0.10); }
    [data-theme="dark"] .ab-modal { background: #1A1A24; color: #F9FAFB; }
    [data-theme="dark"] .ab-field input, [data-theme="dark"] .ab-field select, [data-theme="dark"] .ab-field textarea { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.10); color: #F9FAFB; }
    [data-theme="dark"] .pill-grid { border-color: rgba(255,255,255,0.10); }
    [data-theme="dark"] .ab-cancel { background: rgba(255,255,255,0.08); color: #9CA3AF; }

    /* ── Edit / Delete row buttons ── */
    .book-actions { display: flex; gap: 0.3rem; margin-top: 0.3rem; }
    .btn-icon {
      width: 28px; height: 28px; border-radius: 8px; border: none;
      cursor: pointer; font-size: 0.82rem; display: flex; align-items: center; justify-content: center;
      transition: all 0.18s; font-family: inherit;
    }
    .btn-edit  { background: rgba(5,150,105,0.08);  color: #059669; }
    .btn-edit:hover  { background: rgba(5,150,105,0.18); transform: scale(1.08); }
    .btn-delete { background: rgba(239,68,68,0.08); color: #DC2626; }
    .btn-delete:hover { background: rgba(239,68,68,0.18); transform: scale(1.08); }
    .btn-icon:active { transform: scale(0.92) !important; }
    .btn-summary { background: rgba(99,102,241,0.08); color: #4F46E5; }
    .btn-summary:hover { background: rgba(99,102,241,0.18); transform: scale(1.08); }
    [data-theme="dark"] .btn-edit     { background: rgba(5,150,105,0.14); }
    [data-theme="dark"] .btn-delete   { background: rgba(239,68,68,0.14); }
    [data-theme="dark"] .btn-summary  { background: rgba(99,102,241,0.14); }

    /* ── Summary full-screen overlay ── */
    .sum-overlay {
      display: none; position: fixed; inset: 0; z-index: 600;
      background: rgba(15,15,20,0.6); backdrop-filter: blur(8px);
      align-items: center; justify-content: center; padding: 1.5rem;
    }
    .sum-overlay.open { display: flex; }
    .sum-panel {
      background: #FAFAFA; border-radius: 20px;
      width: 100%; max-width: 760px; height: 86vh;
      display: flex; flex-direction: column;
      box-shadow: 0 40px 120px rgba(0,0,0,0.22), 0 0 0 1px rgba(0,0,0,0.06);
      animation: _modalPop 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
      overflow: hidden;
    }
    .sum-header {
      display: flex; align-items: center; gap: 1rem;
      padding: 1.4rem 2rem 1.1rem; border-bottom: 1px solid rgba(0,0,0,0.06);
      flex-shrink: 0; background: #fff;
    }
    .sum-title-wrap { flex: 1; min-width: 0; }
    .sum-label { font-size: 0.65rem; font-weight: 500; color: #B0B7C3; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.2rem; }
    .sum-book-name { font-size: 1rem; font-weight: 600; color: #1F2937; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sum-close {
      width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer;
      background: transparent; color: #C4CAD4; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: all 0.15s; font-family: inherit;
    }
    .sum-close:hover { background: rgba(239,68,68,0.08); color: #EF4444; }
    .sum-body {
      flex: 1; display: flex; flex-direction: column;
      padding: 2rem 2.5rem 1rem; overflow: hidden; background: #FAFAFA;
    }
    .sum-textarea {
      flex: 1; width: 100%; border: none; outline: none; resize: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 1.02rem; line-height: 1.85; color: #374151; font-weight: 400;
      background: transparent; padding: 0; letter-spacing: 0.01em;
    }
    .sum-textarea::placeholder { color: #D1D5DB; font-weight: 400; }
    .sum-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 2rem; border-top: 1px solid rgba(0,0,0,0.06);
      flex-shrink: 0; background: #fff;
    }
    .sum-wordcount { font-size: 0.72rem; color: #C4CAD4; font-weight: 400; }
    .sum-footer-btns { display: flex; align-items: center; gap: 0.75rem; }
    .sum-status { font-size: 0.75rem; color: #059669; font-weight: 500; }
    .sum-btn-cancel {
      padding: 0.5rem 1.2rem; border-radius: 100px; border: 1px solid #E5E7EB;
      cursor: pointer; font-size: 0.85rem; font-weight: 500; font-family: inherit;
      background: transparent; color: #9CA3AF; transition: all 0.15s;
    }
    .sum-btn-cancel:hover { border-color: #D1D5DB; color: #6B7280; background: #F9FAFB; }
    .sum-btn-save {
      padding: 0.5rem 1.4rem; border-radius: 100px; border: none;
      cursor: pointer; font-size: 0.85rem; font-weight: 600; font-family: inherit;
      background: var(--grad); color: #fff;
      box-shadow: 0 2px 10px rgba(5,150,105,0.30); transition: all 0.2s;
    }
    .sum-btn-save:hover { box-shadow: 0 6px 18px rgba(5,150,105,0.40); transform: translateY(-1px); }
    .sum-btn-save:active, .sum-btn-cancel:active { transform: scale(0.97); }
    [data-theme="dark"] .sum-panel { background: #16161E; box-shadow: 0 40px 120px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06); }
    [data-theme="dark"] .sum-header { background: #1C1C28; border-bottom-color: rgba(255,255,255,0.06); }
    [data-theme="dark"] .sum-book-name { color: #E5E7EB; }
    [data-theme="dark"] .sum-body { background: #16161E; }
    [data-theme="dark"] .sum-textarea { color: #D1D5DB; }
    [data-theme="dark"] .sum-footer { background: #1C1C28; border-top-color: rgba(255,255,255,0.06); }
    [data-theme="dark"] .sum-btn-cancel { border-color: rgba(255,255,255,0.10); color: #6B7280; background: transparent; }
    [data-theme="dark"] .sum-btn-cancel:hover { background: rgba(255,255,255,0.05); color: #9CA3AF; }
    [data-theme="dark"] .sum-close { color: #4B5563; }
    [data-theme="dark"] .sum-close:hover { background: rgba(239,68,68,0.12); color: #EF4444; }

    /* ── Quick-filter chips ── */
    .chip-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .status-chip {
      padding: 0.25rem 0.75rem; border-radius: 100px; font-size: 0.73rem; font-weight: 600;
      background: rgba(5,150,105,0.06); color: #6B7280;
      border: 1.5px solid rgba(5,150,105,0.15);
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .status-chip:hover { background: rgba(5,150,105,0.10); color: var(--accent); }
    .status-chip.active { background: var(--grad); color: #fff; border-color: transparent; }
    .status-chip:active { transform: scale(0.96); }
    [data-theme="dark"] .status-chip { color: #9CA3AF; border-color: rgba(5,150,105,0.22); }

    /* ── Sort row ── */
    .sort-row { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.65rem; flex-wrap: wrap; }
    .sort-label { font-size: 0.72rem; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
    .sort-row select { width: auto; padding: 0.32rem 2rem 0.32rem 0.8rem; font-size: 0.82rem; border-radius: 100px; }

    /* ── View-toggle buttons ── */
    .view-toggle { display: flex; gap: 0.2rem; margin-left: auto; }
    .view-btn {
      width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid rgba(5,150,105,0.20);
      background: rgba(5,150,105,0.06); color: #6B7280; cursor: pointer;
      font-size: 0.95rem; display: flex; align-items: center; justify-content: center;
      transition: all 0.18s; font-family: inherit;
    }
    .view-btn:hover { background: rgba(5,150,105,0.12); color: var(--accent); }
    .view-btn.active { background: var(--grad); color: #fff; border-color: transparent; }
    .view-btn:active { transform: scale(0.92); }

    /* ── Grid view ── */
    .book-list.grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 1rem;
    }
    .book-card {
      background: rgba(255,255,255,0.82); border: 1px solid rgba(255,255,255,0.9);
      border-radius: 18px; overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      display: flex; flex-direction: column;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
    }
    .book-card:hover { transform: translateY(-6px); box-shadow: 0 22px 54px rgba(0,0,0,0.14); }
    .book-card-stripe { height: 5px; background: var(--status-grad, linear-gradient(135deg,#9CA3AF,#D1D5DB)); }
    .book-card-body { flex: 1; padding: 0.9rem; display: flex; flex-direction: column; gap: 0.45rem; }
    .book-card-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .book-card-icon { font-size: 1.55rem; line-height: 1; }
    .book-card-name {
      font-size: 0.88rem; font-weight: 700; color: #111827; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .book-card-author { font-size: 0.73rem; color: #9CA3AF; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .book-card-files { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: auto; padding-top: 0.35rem; }
    .book-card-footer {
      padding: 0.55rem 0.9rem; border-top: 1px solid rgba(0,0,0,0.06);
      display: flex; justify-content: flex-end; gap: 0.35rem;
    }
    [data-theme="dark"] .book-card { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08); }
    [data-theme="dark"] .book-card:hover { box-shadow: 0 22px 60px rgba(0,0,0,0.5); }
    [data-theme="dark"] .book-card-name { color: #F9FAFB; }
    [data-theme="dark"] .book-card-footer { border-top-color: rgba(255,255,255,0.07); }

    /* ── Compact view ── */
    .book-list.compact-view { gap: 0; }
    .book-compact {
      display: flex; align-items: center; gap: 0.65rem; padding: 0.48rem 0.8rem;
      border-bottom: 1px solid rgba(0,0,0,0.05); transition: background 0.15s;
    }
    .book-compact:last-child { border-bottom: none; }
    .book-compact:hover { background: rgba(255,255,255,0.7); }
    .bc-icon { font-size: 0.85rem; width: 20px; text-align: center; flex-shrink: 0; }
    .bc-name {
      flex: 1; font-size: 0.86rem; font-weight: 600; color: #111827;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
    }
    .bc-author { font-size: 0.72rem; color: #9CA3AF; white-space: nowrap; flex-shrink: 0; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
    .bc-file { font-size: 0.65rem; font-weight: 700; padding: 0.1rem 0.45rem; border-radius: 100px; flex-shrink: 0; white-space: nowrap; }
    .bc-file-notion { background: rgba(99,102,241,0.10); color: #4F46E5; }
    .bc-file-drive  { background: rgba(8,145,178,0.10);  color: #0891B2; }
    .bc-file-none   { background: rgba(156,163,175,0.08); color: #D1D5DB; }
    .bc-actions { display: flex; gap: 0.2rem; flex-shrink: 0; }
    [data-theme="dark"] .book-compact { border-bottom-color: rgba(255,255,255,0.06); }
    [data-theme="dark"] .book-compact:hover { background: rgba(255,255,255,0.05); }
    [data-theme="dark"] .bc-name { color: #F9FAFB; }

    /* ── Skeleton ── */
    .skeleton-wrap { padding: 0.5rem 0; }
    .sk-line { border-radius: 8px; background: linear-gradient(90deg,rgba(0,0,0,0.06) 25%,rgba(0,0,0,0.10) 50%,rgba(0,0,0,0.06) 75%); background-size: 200% 100%; animation: _shimmer 1.4s infinite; }
    @keyframes _shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ── Toast ── */
    #toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }
    .toast { padding: 0.7rem 1.1rem; border-radius: 12px; font-size: 0.83rem; font-weight: 500; font-family: inherit; box-shadow: 0 8px 32px rgba(0,0,0,0.13); display: flex; align-items: center; gap: 0.55rem; pointer-events: auto; backdrop-filter: blur(12px); max-width: 300px; animation: _toastIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both; }
    .toast.success { background: rgba(236,253,245,0.97); color: #065F46; border: 1px solid rgba(16,185,129,0.25); }
    .toast.error   { background: rgba(254,242,242,0.97); color: #991B1B; border: 1px solid rgba(239,68,68,0.25); }
    .toast.info    { background: rgba(239,246,255,0.97); color: #1E40AF; border: 1px solid rgba(59,130,246,0.25); }
    .toast.out { animation: _toastOut 0.25s ease forwards; }
    @keyframes _toastIn  { from { opacity:0; transform:translateY(10px) scale(0.95); } to { opacity:1; transform:none; } }
    @keyframes _toastOut { to   { opacity:0; transform:translateY(6px)  scale(0.95); } }

    /* ── Dark mode skeleton ── */
    [data-theme="dark"] .sk-line { background: linear-gradient(90deg,rgba(255,255,255,0.05) 25%,rgba(255,255,255,0.10) 50%,rgba(255,255,255,0.05) 75%); background-size: 200% 100%; }
  </style>
  <script>
    (function(){ var t=localStorage.getItem('ps_theme'); if(t==='dark') document.documentElement.setAttribute('data-theme','dark'); })();
  </script>
</head>
<body>
  <button id="theme-btn" class="theme-btn" onclick="_toggleTheme()" title="Toggle theme">☀️</button>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Add Book Modal (outside container so position:fixed works) -->
  <div class="ab-overlay" id="ab-overlay" onclick="_abClose(event)">
    <div class="ab-modal" onclick="event.stopPropagation()">
      <h2 id="ab-modal-title">📚 Add New Book</h2>
      <div class="ab-field">
        <label>Book Title *</label>
        <input type="text" id="ab-name" placeholder="e.g. Atomic Habits">
      </div>
      <div class="ab-field">
        <label>Status</label>
        <select id="ab-status">
          <option>To Read</option>
          <option>Queued</option>
          <option>Reading</option>
          <option>Finished</option>
          <option>Blocked</option>
        </select>
      </div>
      <div class="ab-field">
        <label>Author</label>
        <select id="ab-author">
          <option value="">— Select author —</option>
        </select>
      </div>
      <div class="ab-field">
        <label>Genre (pick any)</label>
        <div class="pill-grid" id="ab-genre-pills"></div>
      </div>
      <div class="ab-field">
        <label>Google Drive File (optional)</label>
        <div class="drive-picker" id="drive-picker">
          <div class="drive-search-wrap">
            <input type="text" id="ab-drive-search" placeholder="Search your Drive files…" autocomplete="off"
              oninput="_driveFilter()" onfocus="_driveOpen()" onkeydown="_driveKey(event)">
            <button class="drive-clear" id="drive-clear" onclick="_driveClear()" title="Clear">✕</button>
          </div>
          <div class="drive-dropdown" id="drive-dropdown"></div>
          <div id="drive-selected-badge" style="display:none;"></div>
        </div>
        <input type="hidden" id="ab-drive-url">
        <!-- Upload to Drive -->
        <div class="drive-upload-row">
          <input type="file" id="ab-drive-file" accept=".pdf,.doc,.docx" style="display:none" onchange="_driveUpload()">
          <button type="button" class="drive-upload-btn" id="drive-upload-btn" onclick="document.getElementById('ab-drive-file').click()">
            ⬆ Upload PDF to Drive
          </button>
          <div class="drive-upload-progress" id="drive-upload-progress"><div class="drive-upload-progress-bar" id="drive-upload-bar"></div></div>
          <span class="drive-upload-status" id="drive-upload-status"></span>
        </div>
      </div>
      <div class="ab-field">
        <label>Summary (optional)</label>
        <textarea id="ab-summary" rows="3" placeholder="Brief notes…"></textarea>
      </div>
      <p id="ab-error" style="color:#DC2626;font-size:0.82rem;margin-top:0.5rem;display:none;"></p>
      <div class="ab-actions">
        <button class="ab-cancel" onclick="_abClose()">Cancel</button>
        <button class="ab-save" onclick="_abSave()">Save Book</button>
      </div>
    </div>
  </div>

  <!-- Summary Full-Screen Editor -->
  <div class="sum-overlay" id="sum-overlay" onclick="_sumClose(event)">
    <div class="sum-panel" onclick="event.stopPropagation()">
      <div class="sum-header">
        <div class="sum-title-wrap">
          <div class="sum-label">📝 Summary</div>
          <div class="sum-book-name" id="sum-book-name">—</div>
        </div>
        <button class="sum-close" onclick="_sumClose()" title="Close">✕</button>
      </div>
      <div class="sum-body">
        <textarea class="sum-textarea" id="sum-textarea" placeholder="Write your notes, key takeaways, quotes, or thoughts about this book…" oninput="_sumWordCount()"></textarea>
      </div>
      <div class="sum-footer">
        <span class="sum-wordcount" id="sum-wordcount">0 words</span>
        <div class="sum-footer-btns">
          <span class="sum-status" id="sum-status"></span>
          <button class="sum-btn-cancel" onclick="_sumClose()">Cancel</button>
          <button class="sum-btn-save" id="sum-save-btn" onclick="_sumSave()">Save Summary</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="ab-overlay" id="del-overlay" onclick="_delClose(event)">
    <div class="ab-modal" style="max-width:380px;" onclick="event.stopPropagation()">
      <h2 style="color:#DC2626;">🗑 Remove Book?</h2>
      <p style="margin-bottom:1.25rem;color:#6B7280;font-size:0.9rem;line-height:1.5;">
        Remove <strong id="del-book-name" style="color:#111827;"></strong> from your list?
        <br><small style="opacity:0.7;">This archives it in Notion and cannot be undone here.</small>
      </p>
      <div class="ab-actions">
        <button class="ab-cancel" onclick="_delClose()">Cancel</button>
        <button class="ab-save" id="del-confirm-btn" style="background:linear-gradient(135deg,#DC2626,#B91C1C);box-shadow:0 4px 15px rgba(220,38,38,0.35);" onclick="_delDo()">Delete</button>
      </div>
    </div>
  </div>

  <div class="container">
    <nav>
      <a href="/">← Home</a>
      <a href="/books/" class="active">📚 Books</a>
      <a href="/books/charts/">📊 Charts</a>
    </nav>

    <h1>📚 My Reading List</h1>

    <!-- Stats -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Books</div><div class="stat-value" id="s-total">—</div></div>
      <div class="stat-card"><div class="stat-label">Reading</div><div class="stat-value" id="s-reading">—</div></div>
      <div class="stat-card"><div class="stat-label">Finished</div><div class="stat-value" id="s-finished">—</div></div>
      <div class="stat-card"><div class="stat-label">To Read</div><div class="stat-value" id="s-toread">—</div></div>
    </div>

    <!-- Charts -->
    <div class="section-heading"><span>📊</span> Overview</div>
    <div class="charts-grid">
      <div class="card"><canvas id="chart-status" class="chart-wrap"></canvas></div>
      <div class="card"><canvas id="chart-genres" class="chart-wrap"></canvas></div>
    </div>

    <div class="layout" style="margin-top:1.5rem;">
      <!-- Filters -->
      <div>
        <div class="card">
          <div class="section-heading" style="margin-top:0;animation-play-state:running"><span>🔍</span> Filter</div>
          <div class="filters">
            <div>
              <label>Search</label>
              <input type="text" id="f-search" placeholder="Book title…" oninput="_debounce()">
            </div>
            <div>
              <label>Status</label>
              <select id="f-status" onchange="applyFilters()">
                <option value="">All Statuses</option>
                <option>Reading</option>
                <option>To Read</option>
                <option>Queued</option>
                <option>Finished</option>
                <option>Blocked</option>
                <option>Unorganized</option>
              </select>
            </div>
            <div>
              <label>Genre</label>
              <select id="f-genre" onchange="applyFilters()">
                <option value="">All Genres</option>
              </select>
            </div>
            <div>
              <label>Author</label>
              <select id="f-author" onchange="applyFilters()">
                <option value="">All Authors</option>
              </select>
            </div>
          </div>
          <div style="margin-top:0.9rem;">
            <label>Quick Filter</label>
            <div class="chip-row">
              <button class="status-chip" data-status="Reading" onclick="_chipClick('Reading')">📖 Reading</button>
              <button class="status-chip" data-status="To Read" onclick="_chipClick('To Read')">📋 To Read</button>
              <button class="status-chip" data-status="Finished" onclick="_chipClick('Finished')">✅ Finished</button>
              <button class="status-chip" data-status="Queued" onclick="_chipClick('Queued')">⏳ Queued</button>
              <button class="status-chip chip-file" data-file="notion" onclick="_fileFilterClick('notion')">📎 Notion PDF</button>
              <button class="status-chip chip-file" data-file="drive"  onclick="_fileFilterClick('drive')">🔗 Drive Link</button>
              <button class="status-chip chip-file" data-file="none"   onclick="_fileFilterClick('none')">📭 No File</button>
            </div>
          </div>
          <button class="btn-primary" onclick="applyFilters()">Apply</button>
        </div>
      </div>

      <!-- Book list -->
      <div>
        <div class="cache-bar">
          <span id="cache-info">Loading…</span>
          <div class="cache-bar-actions">
            <button class="btn-add" onclick="_abOpen()">+ Add Book</button>
            <button onclick="bustCache()">↺ Refresh</button>
          </div>
        </div>
        <div class="sort-row">
          <span class="sort-label">Sort:</span>
          <select id="sort-select" onchange="_sortChange()">
            <option value="status">Status</option>
            <option value="name-asc">Name A→Z</option>
            <option value="name-desc">Name Z→A</option>
            <option value="recent">Recently Added</option>
            <option value="edited">Recently Edited</option>
          </select>
          <div class="view-toggle">
            <button class="view-btn" id="vbtn-list"    data-view="list"    onclick="_setView('list')"    title="List view">☰</button>
            <button class="view-btn" id="vbtn-grid"    data-view="grid"    onclick="_setView('grid')"    title="Grid view">⊞</button>
            <button class="view-btn" id="vbtn-compact" data-view="compact" onclick="_setView('compact')" title="Compact view">≡</button>
          </div>
        </div>
        <div class="card" style="padding:0.75rem;">
          <div id="book-list" class="book-list">
            <div class="skeleton-wrap">
              <div class="sk-line" style="width:100%;height:5rem;margin-bottom:0.75rem;border-radius:16px;"></div>
              <div class="sk-line" style="width:100%;height:5rem;margin-bottom:0.75rem;border-radius:16px;"></div>
              <div class="sk-line" style="width:100%;height:5rem;margin-bottom:0.75rem;border-radius:16px;"></div>
            </div>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  /* ── Theme toggle ── */
  (function(){
    const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
    const btn = document.getElementById('theme-btn');
    if (btn) btn.textContent = isDark() ? '🌙' : '☀️';
    window._toggleTheme = function(){
      const dark = !isDark();
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      localStorage.setItem('ps_theme', dark ? 'dark' : 'light');
      if (btn) btn.textContent = dark ? '🌙' : '☀️';
    };
  })();

  const PAGE_SIZE = 30;
  let _books = [], _booksRaw = [], _page = 1, _debTimer = null;
  let _allGenres = [], _allAuthors = [];
  let _chartStatus = null, _chartGenres = null;
  let _editPageId = null, _delBook = null;
  let _sortMode = 'status', _fileFilter = null; // 'notion' | 'drive' | 'none' | null
  let _viewMode = localStorage.getItem('ps_books_view') || 'list';

  const STATUS_COLORS = {
    Reading:      { bg: 'rgba(5,150,105,0.8)',   border: '#059669' },
    Finished:     { bg: 'rgba(99,102,241,0.8)',  border: '#4F46E5' },
    'To Read':    { bg: 'rgba(245,158,11,0.8)',  border: '#D97706' },
    Queued:       { bg: 'rgba(8,145,178,0.8)',   border: '#0891B2' },
    Blocked:      { bg: 'rgba(239,68,68,0.8)',   border: '#DC2626' },
    Unorganized:  { bg: 'rgba(156,163,175,0.7)', border: '#9CA3AF' },
  };

  const STATUS_GRAD = {
    Reading:     'linear-gradient(135deg,#059669,#10B981)',
    Finished:    'linear-gradient(135deg,#4F46E5,#7C3AED)',
    'To Read':   'linear-gradient(135deg,#D97706,#F59E0B)',
    Queued:      'linear-gradient(135deg,#0891B2,#06B6D4)',
    Blocked:     'linear-gradient(135deg,#DC2626,#EF4444)',
  };

  function _statusClass(s) {
    const map = { Reading:'reading', Finished:'finished', 'To Read':'to-read', Queued:'queued', Blocked:'blocked' };
    return 'badge badge-' + (map[s] || 'default');
  }

  function _bookIcon(genres) {
    if (genres.some(g => ['Trading','Fundamental Trading','Technical Trading','Mindset Trading'].includes(g))) return '📈';
    if (genres.some(g => ['Tech','System Design'].includes(g))) return '💻';
    if (genres.some(g => ['Sanatan Dharma','Peace','Happiness'].includes(g))) return '🕉️';
    if (genres.some(g => ['Psychology','Mind','Thinking'].includes(g))) return '🧠';
    if (genres.some(g => ['Money','Business'].includes(g))) return '💰';
    if (genres.some(g => ['Habits','Productivity'].includes(g))) return '⚡';
    if (genres.some(g => ['Masculine','Sex'].includes(g))) return '🔱';
    if (genres.some(g => ['Leadership','Personality'].includes(g))) return '👑';
    if (genres.includes('Self Help')) return '🌱';
    return '📖';
  }

  /* ── Shared file-badge builder ── */
  function _fileLinks(b) {
    const links = [...(b.soft_copy||[]), ...(b.key_points||[])].filter(f => f.url);
    if (!links.length) return { html: '<span class="drive-link drive-link-none">📭 No file</span>', compact: null };
    const html = links.map(f => {
      if (f.hosted) return `<a class="drive-link drive-link-notion" href="${f.url}" target="_blank" rel="noopener">📎 Notion PDF</a>`;
      const isGdrive = f.url.includes('drive.google') || f.url.includes('docs.google');
      const icon = isGdrive ? '🔗' : '📄';
      const label = isGdrive ? 'Drive' : (f.name||'').split('.').pop().toUpperCase()||'File';
      return `<a class="drive-link" href="${f.url}" target="_blank" rel="noopener">${icon} ${label}</a>`;
    }).join('');
    // compact badge: just type of first file
    const first = links[0];
    const compactCls = first.hosted ? 'bc-file-notion' : 'bc-file-drive';
    const compactTxt = first.hosted ? '📎 PDF' : '🔗 Drive';
    return { html, compact: `<span class="bc-file ${compactCls}">${compactTxt}</span>` };
  }

  /* ── List row ── */
  function _renderListRow(b) {
    const authors = b.author.slice(0,2).join(', ') + (b.author.length > 2 ? ' +' + (b.author.length-2) : '');
    const genres  = b.genre.slice(0,3);
    const { html: driveHtml } = _fileLinks(b);
    return `<div class="book-row">
      <div class="book-icon">${_bookIcon(b.genre)}</div>
      <div class="book-info">
        <div class="book-name" title="${b.name.replace(/"/g,'&quot;')}">${b.name||'—'}</div>
        <div class="book-meta">${authors||'Unknown author'}</div>
        ${genres.length ? '<div class="genre-tags" style="margin-top:0.35rem;">' + genres.map(g=>`<span class="genre-tag">${g}</span>`).join('') + '</div>' : ''}
        <div style="margin-top:0.4rem;display:flex;gap:0.35rem;flex-wrap:wrap;">${driveHtml}</div>
      </div>
      <div class="book-right">
        <span class="${_statusClass(b.status)}">${b.status||'Unknown'}</span>
        <div class="book-actions">
          <button class="btn-icon btn-summary" onclick="_sumOpen('${b.page_id}')" title="Summary">📝</button>
          <button class="btn-icon btn-edit" onclick="_abEdit('${b.page_id}')" title="Edit">✏</button>
          <button class="btn-icon btn-delete" onclick="_delConfirm('${b.page_id}')" title="Delete">🗑</button>
        </div>
      </div>
    </div>`;
  }

  /* ── Grid card ── */
  function _renderGridCard(b) {
    const author = b.author[0] || 'Unknown author';
    const genres = b.genre.slice(0,2);
    const { html: driveHtml } = _fileLinks(b);
    const grad = STATUS_GRAD[b.status] || 'linear-gradient(135deg,#9CA3AF,#D1D5DB)';
    return `<div class="book-card" style="--status-grad:${grad}">
      <div class="book-card-stripe"></div>
      <div class="book-card-body">
        <div class="book-card-top">
          <span class="book-card-icon">${_bookIcon(b.genre)}</span>
          <span class="${_statusClass(b.status)}">${b.status||'?'}</span>
        </div>
        <div class="book-card-name" title="${b.name.replace(/"/g,'&quot;')}">${b.name||'—'}</div>
        <div class="book-card-author">${author}</div>
        ${genres.length ? '<div class="genre-tags">' + genres.map(g=>`<span class="genre-tag">${g}</span>`).join('') + '</div>' : ''}
        <div class="book-card-files">${driveHtml}</div>
      </div>
      <div class="book-card-footer">
        <button class="btn-icon btn-summary" onclick="_sumOpen('${b.page_id}')" title="Summary">📝</button>
        <button class="btn-icon btn-edit" onclick="_abEdit('${b.page_id}')" title="Edit">✏</button>
        <button class="btn-icon btn-delete" onclick="_delConfirm('${b.page_id}')" title="Delete">🗑</button>
      </div>
    </div>`;
  }

  /* ── Compact row ── */
  function _renderCompactRow(b) {
    const author = b.author[0] || '';
    const { compact: fileBadge } = _fileLinks(b);
    const noFileBadge = `<span class="bc-file bc-file-none">📭</span>`;
    return `<div class="book-compact">
      <span class="bc-icon">${_bookIcon(b.genre)}</span>
      <span class="bc-name" title="${b.name.replace(/"/g,'&quot;')}">${b.name||'—'}</span>
      ${author ? `<span class="bc-author">${author}</span>` : ''}
      ${fileBadge || noFileBadge}
      <span class="${_statusClass(b.status)}" style="font-size:0.65rem;">${b.status||'?'}</span>
      <div class="bc-actions">
        <button class="btn-icon btn-summary" onclick="_sumOpen('${b.page_id}')" title="Summary">📝</button>
        <button class="btn-icon btn-edit" onclick="_abEdit('${b.page_id}')" title="Edit">✏</button>
        <button class="btn-icon btn-delete" onclick="_delConfirm('${b.page_id}')" title="Delete">🗑</button>
      </div>
    </div>`;
  }

  /* ── View switch ── */
  function _setView(mode) {
    _viewMode = mode;
    localStorage.setItem('ps_books_view', mode);
    document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === mode));
    renderBooks();
  }

  /* ── Render book list ── */
  function renderBooks() {
    const list = document.getElementById('book-list');
    const pag  = document.getElementById('pagination');
    if (!_books.length) {
      list.className = 'book-list'; list.innerHTML = '<div class="empty">No books found.</div>'; pag.innerHTML = ''; return;
    }

    const totalPages = Math.ceil(_books.length / PAGE_SIZE);
    const slice = _books.slice((_page - 1) * PAGE_SIZE, _page * PAGE_SIZE);

    if (_viewMode === 'grid') {
      list.className = 'book-list grid-view';
      list.innerHTML = slice.map(_renderGridCard).join('');
    } else if (_viewMode === 'compact') {
      list.className = 'book-list compact-view';
      list.innerHTML = slice.map(_renderCompactRow).join('');
    } else {
      list.className = 'book-list';
      list.innerHTML = slice.map(_renderListRow).join('');
    }

    if (totalPages <= 1) { pag.innerHTML = ''; return; }
    let html = '';
    if (_page > 1) html += `<button class="page-btn" onclick="goPage(${_page-1})">‹ Prev</button>`;
    for (let i=Math.max(1,_page-2); i<=Math.min(totalPages,_page+2); i++)
      html += `<button class="page-btn${i===_page?' active':''}" onclick="goPage(${i})">${i}</button>`;
    if (_page < totalPages) html += `<button class="page-btn" onclick="goPage(${_page+1})">Next ›</button>`;
    pag.innerHTML = html;
  }

  function goPage(p) { _page = p; renderBooks(); window.scrollTo({top:0,behavior:'smooth'}); }

  /* ── Sort ── */
  function sortBooks(books) {
    const ORDER = {Reading:0,'To Read':1,Queued:2,Finished:3,Blocked:4,Unorganized:5};
    const sorted = [...books];
    if (_sortMode === 'status') {
      sorted.sort((a,b) => {
        const sa = ORDER[a.status] ?? 99, sb = ORDER[b.status] ?? 99;
        return sa !== sb ? sa - sb : a.name.toLowerCase().localeCompare(b.name.toLowerCase());
      });
    } else if (_sortMode === 'name-asc') {
      sorted.sort((a,b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
    } else if (_sortMode === 'name-desc') {
      sorted.sort((a,b) => b.name.toLowerCase().localeCompare(a.name.toLowerCase()));
    } else if (_sortMode === 'recent') {
      sorted.sort((a,b) => (b.created_time||'').localeCompare(a.created_time||''));
    } else if (_sortMode === 'edited') {
      sorted.sort((a,b) => (b.last_edited_time||'').localeCompare(a.last_edited_time||''));
    }
    return sorted;
  }

  /* ── File-type helpers ── */
  function _hasNotionFile(b) {
    return [...(b.soft_copy||[]), ...(b.key_points||[])].some(f => f.hosted);
  }
  function _hasDriveLink(b) {
    return [...(b.soft_copy||[]), ...(b.key_points||[])].some(f => !f.hosted);
  }
  function _hasAnyFile(b) {
    return (b.soft_copy||[]).length > 0 || (b.key_points||[]).length > 0;
  }
  function _applyFileFilter(books) {
    if (!_fileFilter) return books;
    if (_fileFilter === 'notion') return books.filter(_hasNotionFile);
    if (_fileFilter === 'drive')  return books.filter(_hasDriveLink);
    if (_fileFilter === 'none')   return books.filter(b => !_hasAnyFile(b));
    return books;
  }

  function _sortChange() {
    _sortMode = document.getElementById('sort-select').value;
    _books = sortBooks(_applyFileFilter(_booksRaw));
    _page = 1; renderBooks();
  }

  /* ── Quick filter chips ── */
  function _chipClick(status) {
    const sel = document.getElementById('f-status');
    sel.value = sel.value === status ? '' : status;
    _syncChips();
    applyFilters();
  }

  function _fileFilterClick(type) {
    _fileFilter = _fileFilter === type ? null : type;
    document.querySelectorAll('.chip-file').forEach(c =>
      c.classList.toggle('active', c.dataset.file === _fileFilter));
    _books = sortBooks(_applyFileFilter(_booksRaw));
    _page = 1; renderBooks();
  }

  function _syncChips() {
    const cur = document.getElementById('f-status').value;
    document.querySelectorAll('.status-chip[data-status]').forEach(c =>
      c.classList.toggle('active', c.dataset.status === cur));
  }

  /* ── Filters ── */
  function applyFilters() {
    const status = document.getElementById('f-status').value;
    const genre  = document.getElementById('f-genre').value;
    const author = document.getElementById('f-author').value;
    const q      = document.getElementById('f-search').value;
    const params = new URLSearchParams();
    if (status) params.set('status', status);
    if (genre)  params.set('genre', genre);
    if (author) params.set('author', author);
    if (q)      params.set('q', q);
    _syncChips();
    document.getElementById('cache-info').textContent = 'Loading…';
    fetch('/books/list/?' + params)
      .then(r => r.json())
      .then(data => {
        _booksRaw = data.books;
        _books = sortBooks(_applyFileFilter(_booksRaw));
        _page = 1; renderBooks();
        document.getElementById('cache-info').textContent = data.total + ' books';
      });
  }

  function _debounce() { clearTimeout(_debTimer); _debTimer = setTimeout(applyFilters, 320); }

  function bustCache() {
    fetch('/books/cache/bust/', {method:'POST'})
      .then(() => { document.getElementById('cache-info').textContent = 'Refreshing…'; applyFilters(); loadStats(); });
  }

  /* ── Charts ── */
  function _chartDefaults() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    return { color: dark ? '#9CA3AF' : '#6B7280', gridColor: dark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.06)' };
  }

  function buildCharts(d) {
    const { color, gridColor } = _chartDefaults();

    // Status donut
    const statusLabels = Object.keys(d.status_counts);
    const statusData   = statusLabels.map(k => d.status_counts[k]);
    const statusBg     = statusLabels.map(k => (STATUS_COLORS[k] || STATUS_COLORS.Unorganized).bg);
    if (_chartStatus) _chartStatus.destroy();
    _chartStatus = new Chart(document.getElementById('chart-status'), {
      type: 'doughnut',
      data: { labels: statusLabels, datasets: [{ data: statusData, backgroundColor: statusBg, borderWidth: 2, borderColor: 'transparent', hoverOffset: 8 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '65%',
        plugins: {
          legend: { position: 'bottom', labels: { color, font: { family:'Inter', size:11, weight:'600' }, padding:12, boxWidth:12, borderRadius:6 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed} books` } }
        }
      }
    });

    // Genre bar (top 15)
    const genres = d.top_genres.slice(0,15);
    const gLabels = genres.map(g => g[0]);
    const gData   = genres.map(g => g[1]);
    const gBg = gLabels.map((_,i) => `hsla(${160 + i*12},60%,${45+i*1.5}%,0.8)`);
    if (_chartGenres) _chartGenres.destroy();
    _chartGenres = new Chart(document.getElementById('chart-genres'), {
      type: 'bar',
      data: { labels: gLabels, datasets: [{ label: 'Books', data: gData, backgroundColor: gBg, borderRadius: 6, borderSkipped: false }] },
      options: {
        responsive: true, maintainAspectRatio: false, indexAxis: 'y',
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.x} books` } } },
        scales: {
          x: { grid: { color: gridColor }, ticks: { color, font: { family:'Inter', size:11 } }, beginAtZero: true },
          y: { grid: { display: false }, ticks: { color, font: { family:'Inter', size:10, weight:'600' } } }
        }
      }
    });
  }

  /* ── Stats ── */
  function loadStats() {
    fetch('/books/stats/')
      .then(r => r.json())
      .then(d => {
        document.getElementById('s-total').textContent    = d.total;
        document.getElementById('s-reading').textContent  = d.status_counts['Reading'] || 0;
        document.getElementById('s-finished').textContent = d.status_counts['Finished'] || 0;
        document.getElementById('s-toread').textContent   = (d.status_counts['To Read']||0) + (d.status_counts['Queued']||0);

        _allGenres  = d.all_genres;
        _allAuthors = d.all_authors;

        // Genre dropdown
        const gSel = document.getElementById('f-genre');
        const curG = gSel.value;
        gSel.innerHTML = '<option value="">All Genres</option>' + d.all_genres.map(g=>`<option${g===curG?' selected':''}>${g}</option>`).join('');

        // Author dropdown
        const aSel = document.getElementById('f-author');
        const curA = aSel.value;
        aSel.innerHTML = '<option value="">All Authors</option>' + d.all_authors.map(a=>`<option${a===curA?' selected':''}>${a}</option>`).join('');

        // Modal author dropdown
        const maSel = document.getElementById('ab-author');
        maSel.innerHTML = '<option value="">— Select author —</option>' + d.all_authors.map(a=>`<option>${a}</option>`).join('');

        // Modal genre pills
        const pillGrid = document.getElementById('ab-genre-pills');
        pillGrid.innerHTML = d.all_genres.map(g=>`<span class="pill" onclick="this.classList.toggle('selected')">${g}</span>`).join('');

        buildCharts(d);
      });
  }

  /* ── Drive file picker ── */
  let _driveFiles = null, _driveLoaded = false, _driveHighlight = -1;

  function _driveLoadFiles() {
    if (_driveLoaded) return;
    _driveLoaded = true;
    const dd = document.getElementById('drive-dropdown');
    dd.innerHTML = '<div class="drive-empty">Loading Drive files…</div>';
    dd.classList.add('open');
    fetch('/books/drive/files/')
      .then(r => r.json())
      .then(d => {
        if (!d.configured) {
          _driveFiles = null;
          dd.innerHTML = '<div class="drive-empty">Drive not connected.<br><small>Run <code>python manage.py authorize_google</code></small></div>';
          return;
        }
        _driveFiles = d.files;
        _driveRenderList(d.files);
      })
      .catch(() => { dd.innerHTML = '<div class="drive-empty">Could not load Drive files.</div>'; });
  }

  function _driveRenderList(files) {
    const dd = document.getElementById('drive-dropdown');
    if (!files.length) { dd.innerHTML = '<div class="drive-empty">No PDF or Doc files found.</div>'; return; }
    dd.innerHTML = files.map((f, i) =>
      `<div class="drive-opt" data-idx="${i}" data-url="${f.url}" data-name="${f.name.replace(/"/g,'&quot;')}" onclick="_driveSelect(${i})">
        <span class="drive-opt-icon">${f.type === 'pdf' ? '📄' : '📝'}</span>
        <span class="drive-opt-name">${f.name}</span>
      </div>`
    ).join('');
  }

  function _driveFilter() {
    const q = document.getElementById('ab-drive-search').value.toLowerCase();
    document.getElementById('drive-clear').classList.toggle('visible', q.length > 0);
    if (!_driveFiles) return;
    const filtered = q ? _driveFiles.filter(f => f.name.toLowerCase().includes(q)) : _driveFiles;
    _driveHighlight = -1;
    document.getElementById('drive-dropdown').classList.add('open');
    _driveRenderList(filtered);
  }

  function _driveOpen() {
    _driveLoadFiles();
    if (_driveFiles) {
      _driveRenderList(_driveFiles);
      document.getElementById('drive-dropdown').classList.add('open');
    }
  }

  function _driveKey(e) {
    const dd = document.getElementById('drive-dropdown');
    const opts = dd.querySelectorAll('.drive-opt');
    if (e.key === 'ArrowDown') { e.preventDefault(); _driveHighlight = Math.min(_driveHighlight+1, opts.length-1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); _driveHighlight = Math.max(_driveHighlight-1, 0); }
    else if (e.key === 'Enter' && _driveHighlight >= 0) { e.preventDefault(); opts[_driveHighlight]?.click(); return; }
    else if (e.key === 'Escape') { dd.classList.remove('open'); return; }
    opts.forEach((o,i) => o.classList.toggle('selected', i === _driveHighlight));
    if (_driveHighlight >= 0) opts[_driveHighlight]?.scrollIntoView({block:'nearest'});
  }

  function _driveSelect(idx) {
    const f = (_driveFiles || [])[idx] || document.querySelector(`.drive-opt[data-idx="${idx}"]`)?.dataset;
    const url  = f?.url  || document.querySelector(`.drive-opt[data-idx="${idx}"]`)?.dataset.url || '';
    const name = f?.name || document.querySelector(`.drive-opt[data-idx="${idx}"]`)?.dataset.name || '';
    document.getElementById('ab-drive-url').value = url;
    document.getElementById('ab-drive-search').value = name;
    document.getElementById('drive-clear').classList.add('visible');
    document.getElementById('drive-dropdown').classList.remove('open');
    const badge = document.getElementById('drive-selected-badge');
    badge.innerHTML = `<span class="drive-selected-badge">🔗 ${name}</span>`;
    badge.style.display = 'block';
  }

  function _driveUpload() {
    const fileInput = document.getElementById('ab-drive-file');
    const file = fileInput.files[0];
    if (!file) return;

    const btn      = document.getElementById('drive-upload-btn');
    const progress = document.getElementById('drive-upload-progress');
    const bar      = document.getElementById('drive-upload-bar');
    const status   = document.getElementById('drive-upload-status');

    btn.disabled = true;
    progress.style.display = 'block';
    status.textContent = 'Uploading…';
    bar.style.width = '15%';

    const form = new FormData();
    form.append('file', file);

    // Simulate progress while waiting (XHR doesn't expose upload progress for small files)
    let pct = 15;
    const ticker = setInterval(() => { pct = Math.min(pct + 8, 85); bar.style.width = pct + '%'; }, 300);

    fetch('/books/drive/upload/', { method: 'POST', body: form })
      .then(r => r.json())
      .then(data => {
        clearInterval(ticker);
        if (data.error) {
          bar.style.width = '0%';
          status.textContent = '✕ ' + data.error;
          status.style.color = '#DC2626';
          return;
        }
        bar.style.width = '100%';
        status.textContent = '✓ Uploaded';
        status.style.color = '#059669';
        // Auto-select the uploaded file in the picker
        document.getElementById('ab-drive-url').value = data.url;
        document.getElementById('ab-drive-search').value = data.name;
        document.getElementById('drive-clear').classList.add('visible');
        document.getElementById('drive-dropdown').classList.remove('open');
        const badge = document.getElementById('drive-selected-badge');
        badge.innerHTML = `<span class="drive-selected-badge">🔗 ${data.name}</span>`;
        badge.style.display = 'block';
        // Refresh Drive file list cache
        _driveLoaded = false; _driveFiles = null;
        setTimeout(() => { progress.style.display = 'none'; bar.style.width = '0%'; status.textContent = ''; }, 2000);
      })
      .catch(() => {
        clearInterval(ticker);
        status.textContent = '✕ Upload failed';
        status.style.color = '#DC2626';
      })
      .finally(() => { btn.disabled = false; fileInput.value = ''; });
  }

  function _driveClear() {
    document.getElementById('ab-drive-url').value = '';
    document.getElementById('ab-drive-search').value = '';
    document.getElementById('drive-clear').classList.remove('visible');
    document.getElementById('drive-selected-badge').style.display = 'none';
    document.getElementById('drive-dropdown').classList.remove('open');
    if (_driveFiles) _driveRenderList(_driveFiles);
    document.getElementById('ab-drive-search').focus();
  }

  // Close dropdown on outside click
  document.addEventListener('click', e => {
    if (!document.getElementById('drive-picker')?.contains(e.target))
      document.getElementById('drive-dropdown')?.classList.remove('open');
  });

  /* ── Add / Edit Book Modal ── */
  function _abOpen() {
    _editPageId = null;
    document.getElementById('ab-modal-title').textContent = '📚 Add New Book';
    document.querySelector('.ab-save').textContent = 'Save Book';
    document.getElementById('ab-name').value = '';
    document.getElementById('ab-status').value = 'To Read';
    document.getElementById('ab-author').value = '';
    document.getElementById('ab-summary').value = '';
    document.getElementById('ab-error').style.display = 'none';
    document.querySelectorAll('#ab-genre-pills .pill').forEach(p => p.classList.remove('selected'));
    _abResetDrive();
    document.getElementById('ab-overlay').classList.add('open');
    setTimeout(() => document.getElementById('ab-name').focus(), 50);
    _driveLoadFiles();
  }

  function _abEdit(pid) {
    const book = _booksRaw.find(b => b.page_id === pid);
    if (!book) return;
    _editPageId = pid;
    document.getElementById('ab-modal-title').textContent = '✏️ Edit Book';
    document.querySelector('.ab-save').textContent = 'Save Changes';
    document.getElementById('ab-name').value = book.name;
    document.getElementById('ab-status').value = book.status || 'To Read';
    // Set author (first author in list)
    const maSel = document.getElementById('ab-author');
    maSel.value = (book.author && book.author[0]) || '';
    document.getElementById('ab-summary').value = book.summary || '';
    document.getElementById('ab-error').style.display = 'none';
    // Pre-select genre pills
    document.querySelectorAll('#ab-genre-pills .pill').forEach(p =>
      p.classList.toggle('selected', (book.genre || []).includes(p.textContent)));
    // Pre-fill Drive picker from first soft_copy entry
    const drive = (book.soft_copy || [])[0];
    _abResetDrive();
    if (drive && drive.url) {
      document.getElementById('ab-drive-url').value = drive.url;
      document.getElementById('ab-drive-search').value = drive.name || 'Drive file';
      document.getElementById('drive-clear').classList.add('visible');
      const badge = document.getElementById('drive-selected-badge');
      badge.innerHTML = `<span class="drive-selected-badge">🔗 ${drive.name || 'Drive file'}</span>`;
      badge.style.display = 'block';
    }
    document.getElementById('ab-overlay').classList.add('open');
    setTimeout(() => document.getElementById('ab-name').focus(), 50);
    _driveLoadFiles();
  }

  function _abResetDrive() {
    document.getElementById('ab-drive-url').value = '';
    document.getElementById('ab-drive-search').value = '';
    document.getElementById('drive-clear').classList.remove('visible');
    document.getElementById('drive-selected-badge').style.display = 'none';
    document.getElementById('drive-dropdown').classList.remove('open');
    document.getElementById('drive-upload-progress').style.display = 'none';
    document.getElementById('drive-upload-bar').style.width = '0%';
    document.getElementById('drive-upload-status').textContent = '';
  }

  function _abClose(e) {
    if (!e || e.target === document.getElementById('ab-overlay'))
      document.getElementById('ab-overlay').classList.remove('open');
  }

  function _abSave() {
    const name      = document.getElementById('ab-name').value.trim();
    const status    = document.getElementById('ab-status').value;
    const author    = document.getElementById('ab-author').value;
    const drive_url = document.getElementById('ab-drive-url').value.trim();
    const summary   = document.getElementById('ab-summary').value.trim();
    const genres    = [...document.querySelectorAll('#ab-genre-pills .pill.selected')].map(p => p.textContent);
    const errEl     = document.getElementById('ab-error');

    if (!name) { errEl.textContent = 'Book title is required.'; errEl.style.display = 'block'; return; }
    errEl.style.display = 'none';

    const saveBtn = document.querySelector('.ab-save');
    const isEdit  = !!_editPageId;
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

    const payload = { name, status, authors: author ? [author] : [], genres, summary, drive_url };
    const url     = isEdit ? `/books/${_editPageId}/update/` : '/books/create/';
    const method  = isEdit ? 'PATCH' : 'POST';

    fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
      if (data.error) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }
      document.getElementById('ab-overlay').classList.remove('open');
      applyFilters();
      loadStats();
    })
    .finally(() => {
      saveBtn.disabled = false;
      saveBtn.textContent = isEdit ? 'Save Changes' : 'Save Book';
    });
  }

  /* ── Summary Editor ── */
  let _sumPageId = null;

  function _sumOpen(pid) {
    const b = _booksRaw.find(x => x.page_id === pid);
    if (!b) return;
    _sumPageId = pid;
    document.getElementById('sum-book-name').textContent = b.name || '—';
    document.getElementById('sum-textarea').value = b.summary || '';
    document.getElementById('sum-status').textContent = '';
    document.getElementById('sum-save-btn').disabled = false;
    document.getElementById('sum-save-btn').textContent = 'Save Summary';
    _sumWordCount();
    document.getElementById('sum-overlay').classList.add('open');
    setTimeout(() => document.getElementById('sum-textarea').focus(), 80);
  }

  function _sumClose(e) {
    if (!e || e.target === document.getElementById('sum-overlay')) {
      document.getElementById('sum-overlay').classList.remove('open');
      _sumPageId = null;
    }
  }

  function _sumWordCount() {
    const text = document.getElementById('sum-textarea').value.trim();
    const words = text ? text.split(/\s+/).length : 0;
    document.getElementById('sum-wordcount').textContent = words + (words === 1 ? ' word' : ' words');
  }

  function _sumSave() {
    if (!_sumPageId) return;
    const summary = document.getElementById('sum-textarea').value.trim();
    const btn = document.getElementById('sum-save-btn');
    const status = document.getElementById('sum-status');
    btn.disabled = true; btn.textContent = 'Saving…'; status.textContent = '';
    fetch(`/books/${_sumPageId}/update/`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ summary }),
    })
    .then(r => r.json())
    .then(d => {
      if (d.error) { status.textContent = '✗ ' + d.error; showToast('Save failed', 'error'); return; }
      const book = _booksRaw.find(x => x.page_id === _sumPageId);
      if (book) book.summary = summary;
      status.textContent = '✓ Saved';
      showToast('Summary saved', 'success');
      setTimeout(() => _sumClose(), 800);
    })
    .catch(() => { status.textContent = '✗ Network error'; showToast('Save failed', 'error'); })
    .finally(() => { btn.disabled = false; btn.textContent = 'Save Summary'; });
  }

  /* ── Delete Modal ── */
  function _delConfirm(pid) {
    _delBook = _booksRaw.find(b => b.page_id === pid);
    if (!_delBook) return;
    document.getElementById('del-book-name').textContent = _delBook.name;
    document.getElementById('del-overlay').classList.add('open');
  }

  function _delClose(e) {
    if (!e || e.target === document.getElementById('del-overlay')) {
      document.getElementById('del-overlay').classList.remove('open');
      _delBook = null;
    }
  }

  function _delDo() {
    if (!_delBook) return;
    const btn = document.getElementById('del-confirm-btn');
    btn.disabled = true; btn.textContent = 'Deleting…';
    fetch(`/books/${_delBook.page_id}/delete/`, { method: 'POST' })
      .then(r => r.json())
      .then(data => {
        if (data.error) { alert('Delete failed: ' + data.error); return; }
        document.getElementById('del-overlay').classList.remove('open');
        _delBook = null;
        applyFilters();
        loadStats();
      })
      .finally(() => { btn.disabled = false; btn.textContent = 'Delete'; });
  }

  function showToast(msg, type, duration) {
    type = type || 'info'; duration = duration || 3000;
    var wrap = document.getElementById('toast-container');
    var el = document.createElement('div');
    el.className = 'toast ' + type;
    var icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
    el.innerHTML = '<span style="font-size:0.9rem">' + icon + '</span><span>' + msg + '</span>';
    wrap.appendChild(el);
    setTimeout(function() {
      el.classList.add('out');
      el.addEventListener('animationend', function() { el.remove(); }, {once:true});
    }, duration);
  }

  /* ── Keyboard shortcut ── */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      _sumClose({target:document.getElementById('sum-overlay')});
      _abClose({target:document.getElementById('ab-overlay')});
      _delClose({target:document.getElementById('del-overlay')});
    }
  });

  /* ── Scroll-triggered animations ── */
  (function(){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting){ e.target.style.animationPlayState='running'; io.unobserve(e.target); } });
    },{threshold:0.06});
    var delay = 0;
    document.querySelectorAll('.card, .stat-card, .section-heading').forEach(function(el){
      el.style.animationDelay = delay + 'ms'; delay = Math.min(delay+80,400); io.observe(el);
    });
  })();

  /* ── Init ── */
  // Restore saved view mode
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === _viewMode));
  loadStats();
  applyFilters();
</script>
<div id="toast-container"></div>
</body>
</html>
