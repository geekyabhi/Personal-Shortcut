<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todos Hierarchy</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234F46E5'/><text x='16' y='22' text-anchor='middle' font-family='system-ui' font-weight='800' font-size='14' fill='white'>PS</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0284C7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shortcut">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent:   #0284C7;
      --accent-2: #6366F1;
      --grad:     linear-gradient(135deg, #0284C7, #6366F1);
      --grad-bg:  linear-gradient(135deg, rgba(2,132,199,0.12), rgba(99,102,241,0.08));
      --dag-line: rgba(2,132,199,0.3);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F5F4FA; color: #111827;
      min-height: 100vh; padding: 1.5rem 1rem; position: relative; overflow-x: hidden;
    }

    .orb { position: fixed; border-radius: 50%; filter: blur(90px); z-index: 0; pointer-events: none; }
    .orb-1 { width: 480px; height: 480px; background: rgba(2,132,199,0.12); top: -160px; right: -100px; }
    .orb-2 { width: 420px; height: 420px; background: rgba(99,102,241,0.09); bottom: -160px; left: -100px; }

    .container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; }

    nav {
      display: flex; gap: 0.4rem; margin-bottom: 2rem; flex-wrap: wrap;
      background: rgba(255,255,255,0.7); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.9); border-radius: 100px;
      padding: 0.35rem; width: fit-content;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      animation: _fadeIn 0.4s ease both;
    }
    nav a {
      padding: 0.4rem 1rem; border-radius: 100px; font-size: 0.85rem;
      font-weight: 600; text-decoration: none; transition: all 0.2s ease;
      color: #6B7280;
    }
    nav a:hover:not(.active) { color: #111827; background: rgba(0,0,0,0.04); }
    nav a.active { background: var(--grad); color: #fff; box-shadow: 0 2px 8px rgba(2,132,199,0.3); }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 500;
      letter-spacing: -0.03em; margin-bottom: 1.75rem;
      background: var(--grad);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: _fadeUp 0.55s 0.1s ease both;
    }

    .card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 20px; padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
      animation: _fadeUp 0.5s ease both; animation-play-state: paused;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.12); }

    h2 { font-size: 1rem; font-weight: 500; margin-bottom: 1rem; letter-spacing: -0.02em; }

    /* ── Stats mini grid ── */
    .stats-mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; margin-bottom: 1.25rem; }
    .stat-mini {
      background: rgba(255,255,255,0.75); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.9); border-radius: 16px;
      padding: 0.85rem 1rem; box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    }
    .stat-mini-lbl { font-size: 0.62rem; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.3rem; }
    .stat-mini-val { font-size: 1.4rem; font-weight: 400; color: #111827; letter-spacing: -0.03em; }
    .stat-mini-val.grad { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    @media (min-width: 480px) { .stats-mini-grid { grid-template-columns: repeat(4, 1fr); } }

    /* ── Legend ── */
    .legend { display: flex; gap: 1rem; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; font-weight: 600; color: #6B7280; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
    .legend-swatch.type-epic    { background: #7C3AED; }
    .legend-swatch.type-story   { background: #059669; }
    .legend-swatch.type-task    { background: #2563EB; }
    .legend-swatch.type-bug     { background: #DC2626; }
    .legend-swatch.type-subtask { background: #9CA3AF; }
    .legend-swatch.type-default { background: #EA580C; }

    /* ── Type badge (reused on nodes) ── */
    .type-badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.64rem; font-weight: 700; white-space: nowrap; flex-shrink: 0;
      padding: 0.1rem 0.45rem; border-radius: 100px; letter-spacing: 0.01em;
    }
    .type-badge.type-epic    { background: #F5F3FF; color: #7C3AED; }
    .type-badge.type-story   { background: #ECFDF5; color: #059669; }
    .type-badge.type-task    { background: #EFF6FF; color: #2563EB; }
    .type-badge.type-bug     { background: #FEF2F2; color: #DC2626; }
    .type-badge.type-subtask { background: #F3F4F6; color: #6B7280; }
    .type-badge.type-default { background: #FFF7ED; color: #EA580C; }
    [data-theme="dark"] .type-badge.type-epic    { background: rgba(124,58,237,0.15); color: #C4B5FD; }
    [data-theme="dark"] .type-badge.type-story   { background: rgba(5,150,105,0.15);  color: #6EE7B7; }
    [data-theme="dark"] .type-badge.type-task    { background: rgba(37,99,235,0.15);  color: #93C5FD; }
    [data-theme="dark"] .type-badge.type-bug     { background: rgba(220,38,38,0.15);  color: #FCA5A5; }
    [data-theme="dark"] .type-badge.type-subtask { background: rgba(107,114,128,0.2); color: #D1D5DB; }
    [data-theme="dark"] .type-badge.type-default { background: rgba(217,119,6,0.15);  color: #FDBA74; }

    .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.status-todo     { background: #9CA3AF; }
    .status-dot.status-progress { background: #2563EB; }
    .status-dot.status-blocked  { background: #DC2626; }
    .status-dot.status-done     { background: #059669; }

    /* ── Hierarchy card header ── */
    .dag-hierarchy-header h2 { margin-bottom: 0.3rem; }
    .dag-hint { font-size: 0.74rem; color: #9CA3AF; font-weight: 500; margin-bottom: 1rem; }
    [data-theme="dark"] .dag-hint { color: #6B7280; }

    /* ── Figma/Whimsical-style pan/zoom canvas ──
       `.dag-wrap` is a fixed-size viewport with a dot-grid background; the
       actual tree lives in `.dag-zoom-surface`, positioned with a single
       `translate(...) scale(...)` transform that a drag (pan) and a
       wheel/pinch (zoom, anchored under the cursor) both drive directly —
       the same interaction model those tools use, rather than native
       scrollbars over a shrunk static image. ── */
    .dag-wrap {
      position: relative; overflow: hidden;
      height: min(64vh, 620px); min-height: 340px;
      border-radius: 16px; margin-top: 0;
      background-color: rgba(2,132,199,0.025);
      background-image: radial-gradient(rgba(2,132,199,0.22) 1px, transparent 1px);
      background-size: 24px 24px;
      cursor: grab; touch-action: pan-y; user-select: none;
    }
    .dag-wrap.dragging { cursor: grabbing; }
    [data-theme="dark"] .dag-wrap {
      background-color: rgba(255,255,255,0.015);
      background-image: radial-gradient(rgba(255,255,255,0.12) 1px, transparent 1px);
    }
    .dag-zoom-surface { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }

    /* Floating zoom toolbar, Figma/Whimsical-style — overlaid bottom-right of the canvas */
    .dag-toolbar {
      position: absolute; right: 14px; bottom: 14px; z-index: 5;
      display: flex; align-items: center; gap: 0.3rem;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.9); border-radius: 100px;
      padding: 0.3rem 0.4rem; box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }
    .dag-zoom-btn {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; border: none;
      background: transparent; color: var(--accent); font-size: 0.95rem; font-weight: 700; line-height: 1;
      cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .dag-zoom-btn:hover { background: rgba(2,132,199,0.12); }
    .dag-zoom-btn:active { transform: scale(0.9); }
    .dag-zoom-label {
      border: none; background: transparent; font-size: 0.74rem; font-weight: 700; color: #6B7280;
      min-width: 40px; text-align: center; cursor: pointer; font-family: inherit; padding: 0.2rem 0;
    }
    .dag-zoom-label:hover { color: var(--accent); }
    .dag-toolbar-sep { width: 1px; height: 16px; background: rgba(0,0,0,0.1); margin: 0 0.1rem; }
    .dag-zoom-fit {
      border: none; background: transparent; color: var(--accent);
      font-size: 0.74rem; font-weight: 600; padding: 0.3rem 0.65rem; border-radius: 100px;
      cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap;
    }
    .dag-zoom-fit:hover { background: rgba(2,132,199,0.12); }
    [data-theme="dark"] .dag-toolbar { background: rgba(20,20,30,0.85); border-color: rgba(255,255,255,0.1); }
    [data-theme="dark"] .dag-zoom-btn { color: #7DD3FC; }
    [data-theme="dark"] .dag-zoom-btn:hover { background: rgba(2,132,199,0.18); }
    [data-theme="dark"] .dag-zoom-label { color: #9CA3AF; }
    [data-theme="dark"] .dag-zoom-fit { color: #7DD3FC; }
    [data-theme="dark"] .dag-zoom-fit:hover { background: rgba(2,132,199,0.18); }
    [data-theme="dark"] .dag-toolbar-sep { background: rgba(255,255,255,0.12); }

    /* ── DAG / hierarchy tree (classic CSS org-chart pattern) ── */
    .dag-forest { display: flex; flex-wrap: wrap; gap: 2.5rem; justify-content: flex-start; width: max-content; min-width: 100%; }
    .dag-tree, .dag-tree ul { list-style: none; margin: 0; padding: 0; position: relative; }
    .dag-tree { display: inline-flex; }
    .dag-tree ul { display: flex; padding-top: 36px; position: relative; }
    .dag-tree li { display: flex; flex-direction: column; align-items: center; position: relative; padding: 36px 12px 0 12px; }
    .dag-tree li::before, .dag-tree li::after {
      content: ''; position: absolute; top: 0; right: 50%;
      border-top: 2px solid var(--dag-line); width: 50%; height: 36px;
    }
    .dag-tree li::after { right: auto; left: 50%; border-left: 2px solid var(--dag-line); }
    .dag-tree li:only-child::before, .dag-tree li:only-child::after { display: none; }
    .dag-tree li:only-child { padding-top: 0; }
    .dag-tree li:first-child::before { border: none; }
    .dag-tree li:last-child::after { border: none; }
    .dag-tree li:last-child::before { border-right: 2px solid var(--dag-line); border-radius: 0 6px 0 0; }
    .dag-tree li:first-child::after { border-radius: 6px 0 0 0; }
    .dag-tree ul::before {
      content: ''; position: absolute; top: 0; left: 50%;
      border-left: 2px solid var(--dag-line); width: 0; height: 36px;
    }

    .dag-node {
      display: flex; flex-direction: column; gap: 0.3rem;
      width: 168px;
      background: rgba(255,255,255,0.9); border: 1.5px solid rgba(0,0,0,0.08); border-left-width: 4px;
      border-radius: 10px; padding: 0.55rem 0.65rem;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      text-decoration: none; color: inherit; cursor: pointer;
      transition: all 0.15s ease;
    }
    .dag-node:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.12); }
    .dag-node.type-epic    { border-left-color: #C4B5FD; background-color: rgba(124,58,237,0.05); }
    .dag-node.type-story   { border-left-color: #6EE7B7; background-color: rgba(16,185,129,0.05); }
    .dag-node.type-task    { border-left-color: #93C5FD; background-color: rgba(59,130,246,0.05); }
    .dag-node.type-bug     { border-left-color: #FCA5A5; background-color: rgba(239,68,68,0.05); }
    .dag-node.type-subtask { border-left-color: #D1D5DB; background-color: rgba(156,163,175,0.06); }
    .dag-node.type-default { border-left-color: #FDBA74; background-color: rgba(249,115,22,0.05); }
    [data-theme="dark"] .dag-node.type-epic    { background-color: rgba(124,58,237,0.09); }
    [data-theme="dark"] .dag-node.type-story   { background-color: rgba(16,185,129,0.09); }
    [data-theme="dark"] .dag-node.type-task    { background-color: rgba(59,130,246,0.09); }
    [data-theme="dark"] .dag-node.type-bug     { background-color: rgba(239,68,68,0.09); }
    [data-theme="dark"] .dag-node.type-subtask { background-color: rgba(156,163,175,0.1); }
    [data-theme="dark"] .dag-node.type-default { background-color: rgba(249,115,22,0.09); }

    .dag-node-top { display: flex; align-items: center; justify-content: space-between; gap: 0.3rem; }
    .dag-node-key { font-size: 0.68rem; font-weight: 700; color: var(--accent); }
    .dag-node-summary {
      font-size: 0.8rem; font-weight: 600; color: #111827; line-height: 1.25;
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }

    .empty-state {
      text-align: center; color: #9CA3AF; font-size: 0.9rem;
      font-weight: 500; padding: 2rem 0;
    }
    .spinner-wrap { display: none; text-align: center; padding: 1.5rem 0; }
    .spinner-ring {
      display: inline-block; width: 32px; height: 32px;
      border: 3px solid rgba(2,132,199,0.15);
      border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-text { font-size: 0.85rem; color: #6B7280; margin-top: 0.6rem; font-weight: 500; }
    .error-box {
      background: rgba(255,242,242,0.9); border: 1.5px solid #FCA5A5;
      color: #B91C1C; border-radius: 14px; padding: 0.9rem 1rem;
      font-size: 0.9rem; margin-bottom: 1.25rem; display: none;
    }

    @media (min-width: 480px) { body { padding: 2rem 1.25rem; } }
    @media (min-width: 768px) { body { padding: 2.5rem 1.5rem; } }

    /* ── Theme toggle button ── */
    .theme-btn {
      position: fixed; top: 0.75rem; right: 0.75rem; z-index: 300;
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.82); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.88);
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      cursor: pointer; font-size: 0.95rem; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    .theme-btn:hover { transform: scale(1.12); box-shadow: 0 4px 18px rgba(0,0,0,0.16); }
    [data-theme="dark"] .theme-btn {
      background: rgba(28,28,40,0.92); border-color: rgba(255,255,255,0.10);
      box-shadow: 0 2px 12px rgba(0,0,0,0.40);
    }

    /* ── Dark mode ── */
    [data-theme="dark"] { --dag-line: rgba(99,102,241,0.35); }
    [data-theme="dark"] body { background: #0D1017; color: #F9FAFB; }
    [data-theme="dark"] .card {
      background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.07);
      box-shadow: 0 4px 24px rgba(0,0,0,0.30);
    }
    [data-theme="dark"] .card:hover { box-shadow: 0 20px 60px rgba(0,0,0,0.50); }
    [data-theme="dark"] nav { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.08); }
    [data-theme="dark"] nav a { color: #9CA3AF; }
    [data-theme="dark"] nav a:not(.active):hover { background: rgba(255,255,255,0.07); color: #E5E7EB; }
    [data-theme="dark"] h2 { color: #E5E7EB; }
    [data-theme="dark"] .stat-mini { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.07); }
    [data-theme="dark"] .stat-mini-lbl { color: #6B7280; }
    [data-theme="dark"] .stat-mini-val { color: #F9FAFB; }
    [data-theme="dark"] .legend-item { color: #9CA3AF; }
    [data-theme="dark"] .dag-node { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.09); }
    [data-theme="dark"] .dag-node-summary { color: #F1F5F9; }
    [data-theme="dark"] .error-box { background: rgba(239,68,68,0.10); }
    [data-theme="dark"] .empty-state { color: rgba(255,255,255,0.3); }

    /* ── Animations ── */
    @keyframes _fadeUp  { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:translateY(0); } }
    @keyframes _fadeIn  { from { opacity:0; } to { opacity:1; } }
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}}
  </style>
  <script>
    (function(){ var t=localStorage.getItem('ps_theme'); if(t==='dark') document.documentElement.setAttribute('data-theme','dark'); })();
  </script>
</head>
<body>
  <button id="theme-btn" class="theme-btn" onclick="_toggleTheme()" title="Toggle theme">☀️</button>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">
    <nav>
      <a href="/">Home</a>
      <a href="/todos/">Jira Todos</a>
      <a href="/todos/charts/" class="active">Charts</a>
    </nav>

    <h1>Todos Hierarchy</h1>

    <div class="error-box" id="error-box"></div>

    <div class="stats-mini-grid" id="stats-mini-grid" style="display:none;">
      <div class="stat-mini">
        <div class="stat-mini-lbl">Total Tickets</div>
        <div class="stat-mini-val grad" id="stat-total">—</div>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-lbl">Epics</div>
        <div class="stat-mini-val" id="stat-epics">—</div>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-lbl">Root Trees</div>
        <div class="stat-mini-val" id="stat-roots">—</div>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-lbl">Subtasks</div>
        <div class="stat-mini-val" id="stat-subtasks">—</div>
      </div>
    </div>

    <div class="card" id="legend-card" style="display:none;">
      <h2>Legend</h2>
      <div class="legend">
        <span class="legend-item"><span class="legend-swatch type-epic"></span>Epic</span>
        <span class="legend-item"><span class="legend-swatch type-story"></span>Story</span>
        <span class="legend-item"><span class="legend-swatch type-task"></span>Task</span>
        <span class="legend-item"><span class="legend-swatch type-bug"></span>Bug</span>
        <span class="legend-item"><span class="legend-swatch type-subtask"></span>Subtask</span>
        <span class="legend-item"><span class="legend-swatch type-default"></span>Other</span>
      </div>
    </div>

    <div class="card">
      <div class="dag-hierarchy-header">
        <h2>Hierarchy — click a ticket to open it in Jira</h2>
        <div class="dag-hint">Drag to pan · pinch or ctrl+scroll to zoom · double-click empty space to fit</div>
      </div>
      <div class="spinner-wrap" id="loading" style="display:block;">
        <div class="spinner-ring"></div>
        <div class="spinner-text">Fetching from Jira…</div>
      </div>
      <div class="dag-wrap" id="dag-wrap" style="display:none;">
        <div class="dag-zoom-surface" id="dag-zoom-surface">
          <div class="dag-forest" id="dag-forest"></div>
        </div>
        <div class="dag-toolbar">
          <button type="button" class="dag-zoom-btn" onclick="dagZoomOut()" title="Zoom out">−</button>
          <button type="button" class="dag-zoom-label" id="dag-zoom-label" onclick="dagZoomReset()" title="Reset to 100%">100%</button>
          <button type="button" class="dag-zoom-btn" onclick="dagZoomIn()" title="Zoom in">+</button>
          <span class="dag-toolbar-sep"></span>
          <button type="button" class="dag-zoom-fit" onclick="dagFitToScreen()" title="Fit the whole tree to the screen">Fit</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const ISSUE_TYPE_ICON = { Task: "☑️", Story: "📖", Epic: "🚀", Rapid: "⚡", Bug: "🐞", Subtask: "📎" };

  function escHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function typeClass(name) {
    const n = (name || "").toLowerCase();
    if (n === "epic") return "type-epic";
    if (n === "story") return "type-story";
    if (n === "task") return "type-task";
    if (n === "bug") return "type-bug";
    if (n === "subtask" || n === "sub-task") return "type-subtask";
    return "type-default";
  }

  function statusDotClass(status) {
    const l = (status || "").toLowerCase();
    if (l.includes("blocked")) return "status-blocked";
    if (l.includes("progress") || l.includes("review")) return "status-progress";
    if (l.includes("done") || l.includes("closed") || l.includes("complete")) return "status-done";
    return "status-todo";
  }

  function errText(err) {
    if (typeof err === "string") return err;
    if (err && typeof err === "object") {
      if (err.message) return err.message;
      if (err.errors && Object.keys(err.errors).length) {
        return Object.entries(err.errors).map(([k, v]) => `${k}: ${v}`).join(", ");
      }
      if (Array.isArray(err.errorMessages) && err.errorMessages.length) return err.errorMessages.join(", ");
    }
    return "Something went wrong talking to Jira.";
  }

  function buildForest(issues) {
    const byKey = {};
    issues.forEach(i => { byKey[i.key] = { ...i, children: [] }; });
    const roots = [];
    issues.forEach(i => {
      const node = byKey[i.key];
      const parent = i.parent_key && byKey[i.parent_key];
      if (parent) parent.children.push(node);
      else roots.push(node);
    });
    const rank = t => (t === "Epic" ? 0 : t === "Subtask" ? 2 : 1);
    const byRankThenKey = (a, b) => rank(a.issuetype) - rank(b.issuetype) || a.key.localeCompare(b.key, undefined, { numeric: true });
    const sortRec = list => { list.sort(byRankThenKey); list.forEach(n => sortRec(n.children)); };
    sortRec(roots);
    return roots;
  }

  function nodeHtml(node) {
    return `
      <a class="dag-node ${typeClass(node.issuetype)}" href="${node.url}" target="_blank" rel="noopener" title="${escHtml(node.summary)}">
        <div class="dag-node-top">
          <span class="type-badge ${typeClass(node.issuetype)}">${ISSUE_TYPE_ICON[node.issuetype] || "📋"} ${escHtml(node.issuetype)}</span>
          <span class="status-dot ${statusDotClass(node.status)}" title="${escHtml(node.status)}"></span>
        </div>
        <span class="dag-node-key">${node.key}</span>
        <span class="dag-node-summary">${escHtml(node.summary)}</span>
      </a>`;
  }

  function treeHtml(node) {
    return `<li>${nodeHtml(node)}${node.children.length ? `<ul>${node.children.map(treeHtml).join("")}</ul>` : ""}</li>`;
  }

  function renderForest(roots) {
    const el = document.getElementById("dag-forest");
    if (!roots.length) {
      el.innerHTML = `<div class="empty-state">No tickets found in Jira yet.</div>`;
      return;
    }
    el.innerHTML = roots.map(r => `<ul class="dag-tree">${treeHtml(r)}</ul>`).join("");
  }

  function countAll(node) {
    return 1 + node.children.reduce((sum, c) => sum + countAll(c), 0);
  }

  /* ── Figma/Whimsical-style pan/zoom canvas ──
     `.dag-zoom-surface` sits at `translate(panX, panY) scale(zoom)` inside
     a fixed-size, `overflow:hidden` viewport (`.dag-wrap`). A drag pans by
     adjusting panX/panY directly; a wheel/pinch zooms by rescaling *and*
     shifting pan so the point under the cursor stays put, exactly like a
     design-tool canvas — rather than shrinking a static image inside
     scrollbars. */
  let dagZoom = 1, dagPanX = 0, dagPanY = 0;
  let dagDragging = false, dagDragMoved = false, dagDragStartX = 0, dagDragStartY = 0, dagPanStartX = 0, dagPanStartY = 0;
  // A low floor on purpose: a flat tree of 80+ siblings can need well under
  // 10% scale to fit on screen at all, and Fit must be able to reach that.
  const DAG_ZOOM_MIN = 0.03, DAG_ZOOM_MAX = 3, DAG_ZOOM_STEP = 0.2;

  function applyDagTransform() {
    const surface = document.getElementById("dag-zoom-surface");
    if (!surface) return;
    surface.style.transform = `translate(${dagPanX}px, ${dagPanY}px) scale(${dagZoom})`;
    const label = document.getElementById("dag-zoom-label");
    if (label) label.textContent = Math.round(dagZoom * 100) + "%";
  }

  // Zooms to `newZoom` while keeping the canvas point under viewport
  // coordinate (cx, cy) visually fixed — the "zoom toward the cursor" feel.
  function dagZoomAt(newZoom, cx, cy) {
    newZoom = Math.min(DAG_ZOOM_MAX, Math.max(DAG_ZOOM_MIN, newZoom));
    const ratio = newZoom / dagZoom;
    dagPanX = cx - (cx - dagPanX) * ratio;
    dagPanY = cy - (cy - dagPanY) * ratio;
    dagZoom = newZoom;
    applyDagTransform();
  }

  function dagViewportCenter() {
    const wrap = document.getElementById("dag-wrap");
    return { x: wrap.clientWidth / 2, y: wrap.clientHeight / 2 };
  }

  function dagZoomIn()  { const c = dagViewportCenter(); dagZoomAt(dagZoom + DAG_ZOOM_STEP, c.x, c.y); }
  function dagZoomOut() { const c = dagViewportCenter(); dagZoomAt(dagZoom - DAG_ZOOM_STEP, c.x, c.y); }

  function dagCenterContent() {
    const wrap = document.getElementById("dag-wrap");
    const forest = document.getElementById("dag-forest");
    if (!wrap || !forest) return;
    dagPanX = (wrap.clientWidth  - forest.scrollWidth  * dagZoom) / 2;
    dagPanY = (wrap.clientHeight - forest.scrollHeight * dagZoom) / 2;
    applyDagTransform();
  }

  function dagZoomReset() { dagZoom = 1; dagCenterContent(); }

  function dagFitToScreen() {
    const wrap   = document.getElementById("dag-wrap");
    const forest = document.getElementById("dag-forest");
    if (!wrap || !forest || !forest.scrollWidth) return;
    const pad = 32;
    const scaleX = (wrap.clientWidth  - pad * 2) / forest.scrollWidth;
    const scaleY = (wrap.clientHeight - pad * 2) / forest.scrollHeight;
    dagZoom = Math.max(DAG_ZOOM_MIN, Math.min(1, Math.min(scaleX, scaleY)));
    dagCenterContent();
  }

  const dagWrapEl = document.getElementById("dag-wrap");

  // Only ctrl+wheel — which is also how browsers report an actual trackpad
  // pinch — zooms, anchored under the cursor. Plain wheel/scroll is left
  // completely alone so the surrounding page keeps scrolling normally even
  // while the cursor is over the canvas (panning is drag-only, below).
  dagWrapEl.addEventListener("wheel", ev => {
    if (!ev.ctrlKey) return;
    ev.preventDefault();
    const rect = dagWrapEl.getBoundingClientRect();
    dagZoomAt(dagZoom * (1 - ev.deltaY * 0.01), ev.clientX - rect.left, ev.clientY - rect.top);
  }, { passive: false });

  // Click-and-drag panning.
  dagWrapEl.addEventListener("mousedown", ev => {
    if (ev.button !== 0) return;
    dagDragging = true; dagDragMoved = false;
    dagDragStartX = ev.clientX; dagDragStartY = ev.clientY;
    dagPanStartX = dagPanX; dagPanStartY = dagPanY;
    dagWrapEl.classList.add("dragging");
    ev.preventDefault();
  });
  window.addEventListener("mousemove", ev => {
    if (!dagDragging) return;
    const dx = ev.clientX - dagDragStartX, dy = ev.clientY - dagDragStartY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dagDragMoved = true;
    dagPanX = dagPanStartX + dx;
    dagPanY = dagPanStartY + dy;
    applyDagTransform();
  });
  window.addEventListener("mouseup", () => {
    if (!dagDragging) return;
    dagDragging = false;
    dagWrapEl.classList.remove("dragging");
  });
  // A drag that happened to pass over a ticket shouldn't open it — only a
  // real (non-moved) click should navigate.
  document.getElementById("dag-forest").addEventListener("click", ev => {
    if (dagDragMoved) { ev.preventDefault(); ev.stopPropagation(); }
  }, true);

  dagWrapEl.addEventListener("dblclick", ev => {
    if (ev.target.closest(".dag-node")) return;
    dagFitToScreen();
  });

  async function loadHierarchy() {
    const loading = document.getElementById("loading");
    const dagWrap = document.getElementById("dag-wrap");
    const errorBox = document.getElementById("error-box");
    loading.style.display = "block";
    dagWrap.style.display = "none";
    errorBox.style.display = "none";

    try {
      const res  = await fetch("/todos/issues/");
      const data = await res.json();
      if (!res.ok) {
        errorBox.textContent = "Failed to load: " + errText(data.error);
        errorBox.style.display = "block";
        return;
      }

      const issues = data.issues;
      const roots  = buildForest(issues);

      document.getElementById("stat-total").textContent    = issues.length;
      document.getElementById("stat-epics").textContent    = issues.filter(i => i.issuetype === "Epic").length;
      document.getElementById("stat-roots").textContent    = roots.length;
      document.getElementById("stat-subtasks").textContent = issues.filter(i => i.issuetype === "Subtask").length;
      document.getElementById("stats-mini-grid").style.display = "grid";
      document.getElementById("legend-card").style.display = "block";

      renderForest(roots);
      dagWrap.style.display = "block";
      dagFitToScreen();
    } catch (e) {
      errorBox.textContent = "Network error: " + e.message;
      errorBox.style.display = "block";
    } finally {
      loading.style.display = "none";
    }
  }

  loadHierarchy();

  /* ── Theme toggle ── */
  (function() {
    const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
    const btn = document.getElementById('theme-btn');
    if (btn) btn.textContent = isDark() ? '🌙' : '☀️';
    window._toggleTheme = function() {
      const dark = !isDark();
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      localStorage.setItem('ps_theme', dark ? 'dark' : 'light');
      if (btn) btn.textContent = dark ? '🌙' : '☀️';
    };
  })();

  /* Scroll-triggered entrance */
  (function(){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){ e.target.style.animationPlayState='running'; io.unobserve(e.target); }
      });
    },{threshold:0.08});
    document.querySelectorAll('.card').forEach(function(el){ io.observe(el); });
  })();
</script>
  <script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/service-worker.js");</script>
</body>
