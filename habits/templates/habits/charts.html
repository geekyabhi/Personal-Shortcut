<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habits Charts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --accent:   #059669;
      --accent-2: #0891B2;
      --grad:     linear-gradient(135deg, #059669, #0891B2);
      --grad-bg:  linear-gradient(135deg, rgba(5,150,105,0.12), rgba(8,145,178,0.08));
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F5F4FA;
      color: #111827;
      min-height: 100vh;
      padding: 1.5rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient orbs */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(90px); z-index: 0; pointer-events: none;
    }
    .orb-1 { width: 480px; height: 480px; background: rgba(5,150,105,0.12); top: -160px; right: -100px; animation: _float 9s ease-in-out infinite; }
    .orb-2 { width: 420px; height: 420px; background: rgba(8,145,178,0.09); bottom: -160px; left: -100px; animation: _float 11s ease-in-out infinite 2s; }

    .container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; }

    /* Nav */
    nav {
      display: flex; gap: 0.4rem; margin-bottom: 2rem; flex-wrap: wrap;
      background: rgba(255,255,255,0.7); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.9); border-radius: 100px;
      padding: 0.35rem; width: fit-content;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      animation: _fadeIn 0.4s ease both;
    }
    nav a {
      padding: 0.4rem 1rem; border-radius: 100px; font-size: 0.85rem;
      font-weight: 600; text-decoration: none; transition: all 0.2s ease;
      color: #6B7280;
    }
    nav a:hover:not(.active) { color: #111827; background: rgba(0,0,0,0.04); }
    nav a.active { background: var(--grad); color: #fff; box-shadow: 0 2px 8px rgba(5,150,105,0.3); }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 900;
      letter-spacing: -0.03em; margin-bottom: 1.75rem;
      background: var(--grad);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: _fadeUp 0.5s 0.1s ease both;
    }

    /* Cards */
    .card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 20px; padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
      animation: _fadeUp 0.5s ease both; animation-play-state: paused;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.12); }
    .card:nth-child(1){animation-delay:0.05s}
    .card:nth-child(2){animation-delay:0.15s}
    .card:nth-child(3){animation-delay:0.25s}
    .card:nth-child(4){animation-delay:0.35s}
    .card:nth-child(5){animation-delay:0.45s}
    .card:nth-child(6){animation-delay:0.55s}

    h2 {
      font-size: 1rem; font-weight: 700; margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    /* Filters */
    .filters { display: grid; grid-template-columns: 1fr; gap: 0.85rem; }

    label {
      display: block; font-size: 0.72rem; font-weight: 700;
      color: #6B7280; margin-bottom: 0.3rem;
      text-transform: uppercase; letter-spacing: 0.06em;
    }

    select, input[type="month"], input[type="week"], input[type="date"], input[type="number"] {
      width: 100%; padding: 0.65rem 0.9rem;
      border: 1.5px solid rgba(0,0,0,0.08); border-radius: 12px;
      font-size: 0.95rem; font-family: inherit;
      background: rgba(255,255,255,0.8); appearance: none; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s; color: #111827;
    }
    select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(5,150,105,0.12);
    }

    .date-input { display: none; }
    .date-input.visible { display: block; }

    /* Presets */
    .presets { display: none; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; }
    .presets.visible { display: flex; }
    .preset-btn {
      padding: 0.35rem 0.85rem; font-size: 0.78rem; font-weight: 600;
      background: rgba(255,255,255,0.8); color: #374151;
      border: 1.5px solid rgba(0,0,0,0.08); border-radius: 100px;
      cursor: pointer; transition: all 0.2s ease; font-family: inherit;
    }
    .preset-btn:hover {
      background: var(--grad); color: #fff; border-color: transparent;
      box-shadow: 0 2px 8px rgba(5,150,105,0.25);
    }

    /* Load button */
    .btn-load {
      margin-top: 1.25rem; width: 100%; padding: 0.85rem;
      background: var(--grad); color: #fff;
      border: none; border-radius: 100px;
      font-size: 1rem; font-weight: 700; font-family: inherit;
      cursor: pointer; letter-spacing: -0.01em;
      box-shadow: 0 4px 16px rgba(5,150,105,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-load:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(5,150,105,0.4); }
    .btn-load:active { transform: scale(0.97); }
    .btn-load:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
    button:active, .btn-primary:active, .btn-ghost:active { transform: scale(0.97); }

    /* Spinner */
    .spinner-wrap { display: none; text-align: center; padding: 1.5rem 0; }
    .spinner-ring {
      display: inline-block; width: 32px; height: 32px;
      border: 3px solid rgba(5,150,105,0.15);
      border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-text { font-size: 0.85rem; color: #6B7280; margin-top: 0.6rem; font-weight: 500; }

    /* Error */
    .error-box {
      background: rgba(255,242,242,0.9); border: 1.5px solid #FCA5A5;
      color: #B91C1C; border-radius: 14px; padding: 0.9rem 1rem;
      font-size: 0.9rem; margin-bottom: 1.25rem; display: none;
    }

    /* Period badge */
    .period-badge {
      display: inline-flex; align-items: center;
      background: var(--grad-bg);
      border: 1px solid rgba(5,150,105,0.2);
      color: var(--accent); border-radius: 100px;
      padding: 0.25rem 0.75rem; font-size: 0.78rem; font-weight: 700;
      margin-bottom: 1rem; letter-spacing: 0.01em;
    }

    /* Stat row */
    .stat-row { display: flex; justify-content: space-between; align-items: baseline; }
    .stat-label { font-size: 0.88rem; color: #6B7280; font-weight: 500; }
    .stat-value {
      font-size: clamp(1.6rem, 4vw, 2rem); font-weight: 900;
      letter-spacing: -0.03em;
      background: var(--grad);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .chart-wrap { position: relative; width: 100%; }

    #results { display: none; }

    /* Heatmap grid */
    .grid-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .grid-table { border-collapse: separate; border-spacing: 3px; }
    .grid-table th {
      font-size: 0.6rem; font-weight: 600; color: #9CA3AF;
      text-align: center; padding: 0;
    }
    .grid-table .habit-label {
      font-size: 0.78rem; font-weight: 600; white-space: nowrap;
      padding-right: 10px; text-align: left; color: #374151;
    }
    .grid-cell { width: 16px; height: 16px; border-radius: 4px; }
    .grid-cell.done     { background: var(--grad); }
    .grid-cell.not-done { background: rgba(0,0,0,0.06); }
    .grid-cell.missing  { background: transparent; border: 1.5px dashed rgba(0,0,0,0.1); }

    .legend {
      display: flex; gap: 1rem; margin-top: 1rem;
      font-size: 0.72rem; color: #6B7280; font-weight: 500; flex-wrap: wrap;
    }
    .legend-dot {
      display: inline-block; width: 12px; height: 12px;
      border-radius: 3px; vertical-align: middle; margin-right: 4px;
    }

    @media (min-width: 480px) {
      body { padding: 2rem 1.25rem; }
      .filters { grid-template-columns: 1fr 1fr; }
      .grid-cell { width: 20px; height: 20px; border-radius: 5px; }
    }
    @media (min-width: 768px) {
      body { padding: 2.5rem 1.5rem; }
    }

    /* ── Theme toggle button ── */
    .theme-btn {
      position: fixed; top: 0.75rem; right: 0.75rem; z-index: 300;
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.82); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.88);
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      cursor: pointer; font-size: 0.95rem; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    .theme-btn:hover { transform: scale(1.12); box-shadow: 0 4px 18px rgba(0,0,0,0.16); }
    [data-theme="dark"] .theme-btn {
      background: rgba(28,28,40,0.92); border-color: rgba(255,255,255,0.10);
      box-shadow: 0 2px 12px rgba(0,0,0,0.40);
    }

    /* ── Dark mode ── */
    [data-theme="dark"] body { background: #0A100D; color: #F9FAFB; }
    [data-theme="dark"] .card {
      background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.07);
      box-shadow: 0 4px 24px rgba(0,0,0,0.30);
    }
    [data-theme="dark"] .card:hover { box-shadow: 0 20px 60px rgba(0,0,0,0.50); }
    [data-theme="dark"] nav { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.08); }
    [data-theme="dark"] nav a { color: #9CA3AF; }
    [data-theme="dark"] nav a:not(.active):hover { background: rgba(255,255,255,0.07); color: #E5E7EB; }
    [data-theme="dark"] h2 { color: #E5E7EB; }
    [data-theme="dark"] label { color: #6B7280; }
    [data-theme="dark"] select,
    [data-theme="dark"] input[type="month"],
    [data-theme="dark"] input[type="week"],
    [data-theme="dark"] input[type="date"],
    [data-theme="dark"] input[type="number"],
    [data-theme="dark"] input[type="text"] {
      background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.12); color: #F9FAFB;
    }
    [data-theme="dark"] .error-box { background: rgba(239,68,68,0.10); }

    /* ── Animations ── */
    @keyframes _fadeUp  { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:translateY(0); } }
    @keyframes _fadeIn  { from { opacity:0; } to { opacity:1; } }
    @keyframes _scaleIn { from { opacity:0; transform:scale(0.93); } to { opacity:1; transform:scale(1); } }
    @keyframes _slideLeft { from { opacity:0; transform:translateX(-16px); } to { opacity:1; transform:translateX(0); } }
    @keyframes _float   { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;}}
  </style>
  <script>
    (function(){ var t=localStorage.getItem('ps_theme'); if(t==='dark') document.documentElement.setAttribute('data-theme','dark'); })();
  </script>
</head>
<body>
  <button id="theme-btn" class="theme-btn" onclick="_toggleTheme()" title="Toggle theme">☀️</button>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">
    <nav>
      <a href="/">Home</a>
      <a href="/habits/">Dashboard</a>
      <a href="/habits/charts/" class="active">Charts</a>
    </nav>

    <h1>Habits Charts</h1>

    <div class="card">
      <div class="filters">
        <div>
          <label for="period">Period</label>
          <select id="period" onchange="onPeriodChange()">
            <option value="all">All Time</option>
            <option value="yearly">Yearly</option>
            <option value="monthly" selected>Monthly</option>
            <option value="weekly">Weekly</option>
            <option value="daily">Daily</option>
            <option value="custom">Custom Range</option>
          </select>
        </div>
        <div id="wrap-year" class="date-input">
          <label for="year">Year</label>
          <input type="number" id="year" min="2000" max="2099" placeholder="e.g. 2026" />
        </div>
        <div id="wrap-month" class="date-input visible">
          <label for="month">Month</label>
          <input type="month" id="month" />
        </div>
        <div id="wrap-week" class="date-input">
          <label for="week">Week</label>
          <input type="week" id="week" />
        </div>
        <div id="wrap-day" class="date-input">
          <label for="day">Day</label>
          <input type="date" id="day" />
        </div>
        <div id="wrap-start" class="date-input">
          <label for="start-date">Start Date</label>
          <input type="date" id="start-date" />
        </div>
        <div id="wrap-end" class="date-input">
          <label for="end-date">End Date</label>
          <input type="date" id="end-date" />
        </div>
      </div>

      <div class="presets" id="wrap-presets">
        <button type="button" class="preset-btn" onclick="setPreset('7d')">Last 7 days</button>
        <button type="button" class="preset-btn" onclick="setPreset('30d')">Last 30 days</button>
        <button type="button" class="preset-btn" onclick="setPreset('3m')">Last 3 months</button>
        <button type="button" class="preset-btn" onclick="setPreset('6m')">Last 6 months</button>
        <button type="button" class="preset-btn" onclick="setPreset('ytd')">Year to date</button>
      </div>

      <button class="btn-load" id="btn" onclick="loadCharts()">Load Charts</button>
    </div>

    <div class="spinner-wrap" id="loading">
      <div class="spinner-ring"></div>
      <div class="spinner-text">Fetching from Notion…</div>
    </div>
    <div class="error-box" id="error-box"></div>

    <div id="results">
      <div class="card">
        <div class="period-badge" id="period-badge"></div>
        <div class="stat-row">
          <span class="stat-label">Days Tracked</span>
          <span class="stat-value" id="stat-days">—</span>
        </div>
      </div>

      <!-- Score trend -->
      <div class="card">
        <h2>Score Trend</h2>
        <div class="chart-wrap">
          <canvas id="score-chart"></canvas>
        </div>
      </div>

      <!-- Daily binary heatmap grid -->
      <div class="card" id="grid-card" style="display:none;">
        <h2>Daily Achievement</h2>
        <div class="grid-scroll">
          <div id="habit-grid"></div>
        </div>
        <div class="legend">
          <span><span class="legend-dot" style="background:var(--accent);"></span>Done</span>
          <span><span class="legend-dot" style="background:rgba(0,0,0,0.06);"></span>Not done</span>
          <span><span class="legend-dot" style="background:transparent;border:1.5px dashed rgba(0,0,0,0.15);"></span>No entry</span>
        </div>
      </div>

      <!-- Days done bar chart -->
      <div class="card">
        <h2>Days Done per Habit</h2>
        <div class="chart-wrap">
          <canvas id="habit-chart"></canvas>
        </div>
      </div>
    </div>
  </div>

<script>
  let scoreChart = null;
  let habitChart = null;

  const today = new Date();
  document.getElementById("year").value       = today.getFullYear();
  document.getElementById("month").value      = today.toISOString().slice(0, 7);
  document.getElementById("week").value       = isoWeek(today);
  document.getElementById("day").value        = today.toISOString().slice(0, 10);
  document.getElementById("end-date").value   = today.toISOString().slice(0, 10);
  document.getElementById("start-date").value = monthsAgo(1).toISOString().slice(0, 10);

  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    const ys = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    const w = Math.ceil((((t - ys) / 86400000) + 1) / 7);
    return `${t.getUTCFullYear()}-W${String(w).padStart(2, "0")}`;
  }

  function monthsAgo(n) {
    const d = new Date();
    d.setMonth(d.getMonth() - n);
    return d;
  }

  function setPreset(key) {
    const end = new Date();
    const start = new Date();
    if (key === "7d")  start.setDate(start.getDate() - 6);
    if (key === "30d") start.setDate(start.getDate() - 29);
    if (key === "3m")  start.setMonth(start.getMonth() - 3);
    if (key === "6m")  start.setMonth(start.getMonth() - 6);
    if (key === "ytd") start.setMonth(0, 1);
    document.getElementById("start-date").value = start.toISOString().slice(0, 10);
    document.getElementById("end-date").value   = end.toISOString().slice(0, 10);
  }

  function onPeriodChange() {
    const p = document.getElementById("period").value;
    const map = { year: "yearly", month: "monthly", week: "weekly", day: "daily" };
    Object.entries(map).forEach(([id, val]) => {
      document.getElementById(`wrap-${id}`).className = "date-input" + (p === val ? " visible" : "");
    });
    ["start", "end"].forEach(id => {
      document.getElementById(`wrap-${id}`).className = "date-input" + (p === "custom" ? " visible" : "");
    });
    document.getElementById("wrap-presets").className = "presets" + (p === "custom" ? " visible" : "");
  }

  function buildParams() {
    const period = document.getElementById("period").value;
    const p = new URLSearchParams({ period });
    if (period === "yearly")  p.set("year",  document.getElementById("year").value);
    if (period === "monthly") p.set("month", document.getElementById("month").value);
    if (period === "weekly")  p.set("week",  document.getElementById("week").value);
    if (period === "daily")   p.set("day",   document.getElementById("day").value);
    if (period === "custom") {
      p.set("start", document.getElementById("start-date").value);
      p.set("end",   document.getElementById("end-date").value);
    }
    return p.toString();
  }

  function periodLabel(d) {
    if (d.period === "all")     return "All Time";
    if (d.period === "yearly")  return d.year;
    if (d.period === "monthly") return d.month;
    if (d.period === "weekly")  return `${d.week_start} – ${d.week_end}`;
    if (d.period === "daily")   return d.date;
    if (d.period === "custom")  return `${d.start} – ${d.end}`;
  }

  function rateColor(ratio) {
    if (ratio >= 0.8) return "#059669";
    if (ratio >= 0.5) return "#D97706";
    return "#DC2626";
  }

  function renderScoreChart(labels, values) {
    if (scoreChart) scoreChart.destroy();
    scoreChart = new Chart(document.getElementById("score-chart").getContext("2d"), {
      type: "line",
      data: {
        labels,
        datasets: [{
          data: values,
          borderColor: "#059669",
          backgroundColor: "rgba(5,150,105,0.08)",
          fill: true,
          tension: 0.4,
          pointRadius: 4,
          pointHoverRadius: 6,
          pointBackgroundColor: "#059669",
          pointBorderColor: "#fff",
          pointBorderWidth: 2,
          spanGaps: false,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        aspectRatio: window.innerWidth < 480 ? 1.4 : 2.8,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: c => ` Score: ${c.parsed.y}` } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 10 }, maxRotation: 45 } },
          y: { beginAtZero: true, grid: { color: "rgba(0,0,0,0.04)" }, ticks: { font: { size: 10 } } }
        }
      }
    });
  }

  function renderHabitGrid(grid) {
    const card = document.getElementById("grid-card");
    const container = document.getElementById("habit-grid");
    if (!grid || !grid.habits.length) {
      card.style.display = "none";
      return;
    }
    card.style.display = "block";

    const { dates, habits } = grid;
    const isWeekly = dates.length <= 7;
    const colLabels = dates.map(d => {
      const dt = new Date(d + "T00:00:00");
      return isWeekly
        ? dt.toLocaleDateString("en-US", { weekday: "short" }).slice(0, 2)
        : String(dt.getUTCDate());
    });

    let html = `<table class="grid-table"><thead><tr><th class="habit-label"></th>`;
    colLabels.forEach(l => { html += `<th>${l}</th>`; });
    html += `</tr></thead><tbody>`;

    habits.forEach(({ name, values }) => {
      html += `<tr><td class="habit-label">${name}</td>`;
      values.forEach((v, i) => {
        const cls = v === null ? "missing" : v === 1 ? "done" : "not-done";
        const title = `${dates[i]}: ${v === null ? "no entry" : v === 1 ? "done" : "not done"}`;
        html += `<td title="${title}"><div class="grid-cell ${cls}"></div></td>`;
      });
      html += `</tr>`;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
  }

  function renderHabitChart(labels, values, totalDays) {
    if (habitChart) habitChart.destroy();
    const canvas = document.getElementById("habit-chart");
    canvas.style.height = `${Math.max(200, labels.length * 40)}px`;

    habitChart = new Chart(canvas.getContext("2d"), {
      type: "bar",
      data: {
        labels,
        datasets: [{
          data: values,
          backgroundColor: values.map(v => rateColor(totalDays ? v / totalDays : 0)),
          borderRadius: 6,
          borderSkipped: false,
        }]
      },
      options: {
        indexAxis: "y",
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: c => ` ${c.parsed.x} / ${totalDays} day${totalDays === 1 ? "" : "s"}`
            }
          }
        },
        scales: {
          x: {
            beginAtZero: true,
            max: totalDays || 1,
            grid: { color: "rgba(0,0,0,0.04)" },
            ticks: { font: { size: 10 }, stepSize: 1, callback: v => Number.isInteger(v) ? v : "" }
          },
          y: { grid: { display: false }, ticks: { font: { size: 10 } } }
        }
      }
    });
  }

  async function loadCharts() {
    const btn = document.getElementById("btn");
    btn.disabled = true;
    document.getElementById("loading").style.display = "block";
    document.getElementById("results").style.display = "none";
    document.getElementById("error-box").style.display = "none";

    try {
      const res  = await fetch(`/habits/chart/?${buildParams()}`);
      const data = await res.json();
      if (!res.ok) {
        document.getElementById("error-box").textContent = data.error || "Error";
        document.getElementById("error-box").style.display = "block";
        return;
      }

      document.getElementById("period-badge").textContent = periodLabel(data);
      document.getElementById("stat-days").textContent    = data.total_days + " days";

      renderScoreChart(data.score_trend.labels, data.score_trend.values);
      renderHabitGrid(data.habit_grid);
      renderHabitChart(data.habit_counts.labels, data.habit_counts.values, data.total_days);

      document.getElementById("results").style.display = "block";
    } catch (e) {
      document.getElementById("error-box").textContent = "Network error: " + e.message;
      document.getElementById("error-box").style.display = "block";
    } finally {
      document.getElementById("loading").style.display = "none";
      btn.disabled = false;
    }
  }

  /* ── Theme toggle ── */
  (function() {
    const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
    const btn = document.getElementById('theme-btn');
    if (btn) btn.textContent = isDark() ? '🌙' : '☀️';
    window._toggleTheme = function() {
      const dark = !isDark();
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      localStorage.setItem('ps_theme', dark ? 'dark' : 'light');
      if (btn) btn.textContent = dark ? '🌙' : '☀️';
    };
  })();
</script>
<script>
(function(){
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.style.animationPlayState='running'; io.unobserve(e.target); }
    });
  },{threshold:0.08});
  document.querySelectorAll('.card').forEach(function(el){ io.observe(el); });
})();
</script>
</body>
</html>
