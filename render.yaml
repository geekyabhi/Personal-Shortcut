services:
  - type: web
    name: personal-shortcut
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /login/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_EXPENSES_DB_ID
        sync: false
      - key: NOTION_HABITS_DB_ID
        sync: false
      - key: NOTION_BOOKS_DB_ID
        sync: false
      - key: NOTION_READ_BLOGS_DB_ID
        sync: false
      - key: NOTION_WRITE_BLOGS_DB_ID
        sync: false
      - key: NOTION_SHARED_EXPENSES_DB_ID
        sync: false
      - key: ALLOWED_EMAIL
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_PROJECT_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_UPLOAD_FOLDER_ID
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_WEB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
