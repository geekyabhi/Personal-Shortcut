# Local Postgres for development: `docker compose up -d db`
# Then in .env:
#   DATABASE_URL=postgres://shortcut:shortcut@localhost:5433/shortcut
#   DATABASE_SSL_REQUIRE=False
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shortcut
      POSTGRES_PASSWORD: shortcut
      POSTGRES_DB: shortcut
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortcut"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
